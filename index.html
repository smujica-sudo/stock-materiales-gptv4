  <style>
    :root{
      --app-bg:#F9FAFB;
      --app-surface:#FFFFFF;
      --app-stroke:#EAECF0;
      --app-stroke-strong:#D0D5DD;
      --app-text:#101828;
      --app-muted:#667085;
      --app-primary:#7F56D9;
      --app-primary-strong:#6941C6;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    html,body{margin:0;background:var(--app-bg);color:var(--app-text);font-family:Inter,system-ui,sans-serif;min-height:100%;overflow-x:hidden}
    body{padding-bottom:calc(88px + var(--safe-bottom))}
    #app{min-height:100vh}
    .material-symbols-rounded{font-variation-settings:'FILL' 0,'wght' 500,'GRAD' 0,'opsz' 24}
    .mn{font-variant-numeric:tabular-nums}
    .glass{backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
    .hide-scrollbar::-webkit-scrollbar{display:none}
    .hide-scrollbar{scrollbar-width:none}
    .fade-up{animation:fadeUp .24s ease both}
    @keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
    @keyframes toastin{from{opacity:0;transform:translate(-50%,-8px)}to{opacity:1;transform:translate(-50%,0)}}
    @keyframes pulseSoft{0%,100%{opacity:1}50%{opacity:.55}}
    .safe-top{padding-top:max(20px,calc(16px + var(--safe-top)))}
    .safe-bottom{padding-bottom:max(16px,calc(12px + var(--safe-bottom)))}
    .bottom-shadow{box-shadow:0 -8px 32px rgba(16,24,40,.08)}
    .gradient-shell{background:radial-gradient(circle at top left, rgba(127,86,217,.18), transparent 34%),radial-gradient(circle at top right, rgba(23,92,211,.12), transparent 26%),#F9FAFB}
    .hero-grad{background:linear-gradient(135deg,#101828 0%,#1D2939 38%,#53389E 100%)}
    .line-clamp-2{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
    input,button,textarea,select{font:inherit}
    .app-shell-grid{display:grid;grid-template-columns:minmax(0,1fr);min-height:100vh}
    .app-shell-rail{display:none}
    .app-shell-main{min-width:0}
    .sticky-blur{position:sticky;top:0;z-index:20;background:linear-gradient(180deg,rgba(249,250,251,.96),rgba(249,250,251,.82) 76%,rgba(249,250,251,0));backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
    .desktop-panel{display:none}
    .skeleton{animation:pulseSoft 1.2s ease-in-out infinite;background:#EAECF0}
    @media (min-width: 980px){
      body{padding-bottom:32px}
      .app-shell-grid{grid-template-columns:300px minmax(0,1fr);gap:24px;max-width:1440px;margin:0 auto;padding:24px 24px 32px}
      .app-shell-rail{display:block;position:sticky;top:24px;height:calc(100vh - 48px)}
      .app-shell-main{max-width:880px;width:100%}
      .desktop-panel{display:block}
      .mobile-bottom-nav{display:none}
      .safe-top{padding-top:0}
    }
  </style>

    function esc(s){return s==null?'':String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
    function ts(){var d=new Date(),p=function(n){return ('0'+n).slice(-2)};return p(d.getDate())+'/'+p(d.getMonth()+1)+' '+p(d.getHours())+':'+p(d.getMinutes())}
    function st(x){if(x.stock===0)return 'zero';if(x.stock<x.min*.3)return 'crit';if(x.stock<x.min)return 'low';return 'ok'}
    var STC={

    function statusTheme(s){
      if(s==='ok') return {dot:'bg-success-700', soft:'bg-success-50 text-success-700 border-green-200', bar:'#12B76A', text:'text-success-700'};
      if(s==='low') return {dot:'bg-warning-700', soft:'bg-warning-50 text-warning-700 border-amber-200', bar:'#F79009', text:'text-warning-700'};
      return {dot:'bg-error-700', soft:'bg-error-50 text-error-700 border-red-200', bar:'#F04438', text:'text-error-700'};
    }

    function alerts(){
      return items.filter(function(x){return st(x)!=='ok'}).sort(function(a,b){

        return o[st(a)]-o[st(b)];
      });

    function gc(c){
      if(CC_KNOWN[c])return CC_KNOWN[c];

      if(CC_KNOWN[fw])return CC_KNOWN[fw];
      return {i:'category',c:'#7F56D9'};

    function isOnline(){return API_URL!==''&&API_URL!=='DEMO'&&API_URL!=='TU_URL_AQUI'}
    function normalizeUsers(arr){
      return (arr||[]).map(function(u){return {n:String(u.nombre||u.n||'Usuario').trim(),p:String(u.pin||u.p||'').trim()}}).filter(function(u){return u.n&&u.p});
    }
    function loadCachedUsers(){
      try{
        var raw=localStorage.getItem(AUTH_CACHE_KEY);
        if(!raw)return [];
        var parsed=JSON.parse(raw), users=normalizeUsers(parsed);
        if(users.length){AUTH_USERS=users;authSource='cache';authMessage='Usuarios cargados desde caché local'}
        return users;
      }catch(e){return []}
    }
    function saveCachedUsers(users){try{localStorage.setItem(AUTH_CACHE_KEY,JSON.stringify(users||[]))}catch(e){}}
    function buildApiUrl(params){var q=Object.keys(params||{}).map(function(k){return encodeURIComponent(k)+'='+encodeURIComponent(params[k])}).join('&');return API_URL+(API_URL.indexOf('?')>-1?'&':'?')+q}

    function fetchTextWithTimeout(url,opts,timeoutMs){
      timeoutMs=timeoutMs||12000;
      return new Promise(function(resolve,reject){
        var done=false;
        var t=setTimeout(function(){if(done)return;done=true;reject(new Error('Timeout '+timeoutMs+'ms'))},timeoutMs);
        fetch(url,opts||{}).then(function(r){if(done)return;clearTimeout(t);done=true;resolve(r)}).catch(function(err){if(done)return;clearTimeout(t);done=true;reject(err)})
      });
    }
    function fetchJsonWithTimeout(url,opts,timeoutMs){
      return fetchTextWithTimeout(url,opts,timeoutMs).then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);return r.text()}).then(function(txt){try{return JSON.parse(txt)}catch(e){throw new Error('Respuesta no JSON desde Apps Script')}})

    function loadUsers(force){
      if(authLoading && authPromise) return authPromise;
      if(authLoaded && !force && AUTH_USERS.length) return Promise.resolve(AUTH_USERS);
      if(!isOnline()){
        authLoaded=true;authError=true;
        if(!AUTH_USERS.length){AUTH_USERS=USERS.slice();authSource='demo';authMessage='API_URL sin conexión; usando usuarios locales'}
        else{authSource='cache';authMessage='Sin conexión; usando caché local de usuarios'}
        return Promise.resolve(AUTH_USERS);
      }
      authLoading=true;authMessage='Consultando usuarios en Apps Script...';
      authPromise=fetchJsonWithTimeout(buildApiUrl({action:'getUsers',_ts:Date.now()}),{cache:'no-store'},12000)
        .then(function(d){
          if(d&&d.success&&d.users&&d.users.length){
            AUTH_USERS=normalizeUsers(d.users);
            if(!AUTH_USERS.length) throw new Error('Usuarios vacíos o mal formateados');
            saveCachedUsers(AUTH_USERS);authError=false;authSource='backend';authMessage='Usuarios cargados desde Apps Script';
          }else if(d&&d.error){throw new Error(String(d.error))}
          else{throw new Error('getUsers no devolvió usuarios')}
          authLoaded=true;authLoading=false;authPromise=null;safeRedraw();return AUTH_USERS;
        }).catch(function(){
          authLoaded=true;authLoading=false;authError=true;authPromise=null;
          if(!AUTH_USERS.length){AUTH_USERS=USERS.slice();authSource='demo';authMessage='No fue posible leer usuarios del backend; usando fallback local'}
          else{authSource='cache';authMessage='Backend sin respuesta; usando caché local'}
          safeRedraw();return AUTH_USERS;
        });
      return authPromise;
    }

    function sync(){

      var stockReq=fetchJsonWithTimeout(buildApiUrl({action:'getAll',_ts:Date.now()}),{cache:'no-store'},15000).then(function(d){
        if(!(d&&d.success&&d.items)) throw new Error(d&&d.error?String(d.error):'getAll inválido');
        return d.items.map(function(x){return{id:String(x.id),cat:String(x.categoria),subcat:String(x.subcategoria||''),name:String(x.nombre),stock:Number(x.stock)||0,min:Number(x.minimo)||0,unit:String(x.unidad)||'uds',alert:String(x.alerta)||''}});

        if(!(d&&d.success&&d.entries)) throw new Error(d&&d.error?String(d.error):'getHistory inválido');
        return d.entries.map(function(x){return{id:String(x.itemId),nm:String(x.itemNombre),cat:String(x.categoria),tp:String(x.tipo),os:Number(x.stockAnterior)||0,ns:Number(x.stockNuevo)||0,nt:String(x.nota)||'',u:String(x.usuario)||'?',ts:x.timestamp?x.timestamp.substring(0,16).replace('T',' '):''}});
      });
      return Promise.allSettled([stockReq,histReq]).then(function(results){
        if(syncId!==syncCounter) return false;
        var stockOk=results[0].status==='fulfilled';
        var histOk=results[1].status==='fulfilled';
        if(stockOk) items=results[0].value;
        if(histOk) hist=results[1].value;

        if(!stockOk && !histOk) toast('No se pudo sincronizar con Apps Script','warn');
        else if(!stockOk || !histOk) toast('Sincronización parcial completada','warn');
        return stockOk||histOk;
      }).catch(function(){toast('No se pudo sincronizar','warn');return false});

    function calcProjection(item){
      var pad=function(n){return ('0'+n).slice(-2)};
      if(item.stock<=0) return {title:'Sin stock',subtitle:'No hay unidades disponibles',days:'0',dailyUse:'-',dateOut:'-',color:'#B42318',daysNum:0};
      var moves=hist.filter(function(h){return h.id===item.id});
      var consumptions=[];
      moves.forEach(function(h){if(h.ns<h.os) consumptions.push({amount:h.os-h.ns,ts:h.ts,tp:h.tp})});
      function parseTS(t){
        if(!t)return null;var d=new Date(t);if(!isNaN(d.getTime()))return d;
        var parts=t.split(' ');
        if(parts[0]&&parts[0].indexOf('/')>-1){var dp=parts[0].split('/');var day=parseInt(dp[0]),mon=parseInt(dp[1])-1;var yr=dp[2]?parseInt(dp[2]):new Date().getFullYear();if(yr<100)yr+=2000;var hr=0,mi=0;if(parts[1]&&parts[1].indexOf(':')>-1){var tp=parts[1].split(':');hr=parseInt(tp[0]);mi=parseInt(tp[1])}return new Date(yr,mon,day,hr,mi)}
        return null;
      }
      if(consumptions.length<1){
        if(item.min>0){
          var estDaily=Math.max(1,Math.round(item.min/14));
          var estDays=Math.round(item.stock/estDaily);
          var estDate=new Date();estDate.setDate(estDate.getDate()+estDays);
          var dc=estDays<=7?'#B42318':estDays<=21?'#B54708':estDays<=45?'#175CD3':'#027A48';
          return {title:estDays<=7?'Agotamiento inminente':estDays<=21?'Stock limitado':estDays<=45?'Stock moderado':'Stock holgado',subtitle:'Estimado (aún sin datos de consumo)',days:String(estDays),dailyUse:'~'+estDaily,dateOut:pad(estDate.getDate())+'/'+pad(estDate.getMonth()+1),color:dc,daysNum:estDays};
        }
        return null;
      }
      var totalConsumed=0;consumptions.forEach(function(c){totalConsumed+=c.amount});
      var spanDays=0;var dates=consumptions.map(function(c){return parseTS(c.ts)}).filter(function(d){return d!==null});
      if(dates.length>=2){dates.sort(function(a,b){return a-b});spanDays=Math.max(1,Math.round(Math.abs(dates[dates.length-1]-dates[0])/86400000));}
      else if(dates.length===1){spanDays=Math.max(1,Math.round(Math.abs(new Date()-dates[0])/86400000));}
      else{spanDays=Math.max(1,consumptions.length*3)}
      var dailyUse=totalConsumed/spanDays;if(dailyUse<=0)dailyUse=0.1;
      var daysLeft=Math.round(item.stock/dailyUse);var futureDate=new Date();futureDate.setDate(futureDate.getDate()+daysLeft);
      var dateStr=pad(futureDate.getDate())+'/'+pad(futureDate.getMonth()+1);
      var color=daysLeft<=7?'#B42318':daysLeft<=21?'#B54708':daysLeft<=45?'#175CD3':'#027A48';
      var title=daysLeft<=0?'Sin stock':daysLeft<=7?'Agotamiento inminente':daysLeft<=14?'Pedir pronto':daysLeft<=30?'Stock limitado':daysLeft<=60?'Stock moderado':'Stock holgado';
      var types={};consumptions.forEach(function(c){types[c.tp]=(types[c.tp]||0)+1});
      var desc=[];if(types['salida'])desc.push(types['salida']+' salida'+(types['salida']>1?'s':''));if(types['ajuste'])desc.push(types['ajuste']+' ajuste'+(types['ajuste']>1?'s':''));
      var sub='Basado en '+(desc.length?desc.join(' + '):consumptions.length+' mov.')+' en '+spanDays+' día'+(spanDays>1?'s':'');
      return {title:title,subtitle:sub,days:String(daysLeft),dailyUse:dailyUse<1?dailyUse.toFixed(1):Math.round(dailyUse).toString(),dateOut:dateStr,color:color,daysNum:daysLeft};
    }

      inner+='<section class="mt-4"><div class="mb-3"><div class="text-lg font-semibold text-gray-900">Historial reciente</div><div class="text-sm text-gray-500">'+itemHistory.length+' movimientos visibles</div></div>'+ (itemHistory.length?'<div class="space-y-3">'+itemHistory.map(historyCard).join('')+'</div>':emptyState('schedule','Sin movimientos','Aún no hay registros para este producto.')) +'</section>';
      inner+='</div></main>';
      return appShell(inner,navHtml(pg,alerts().filter(function(a){return st(a)==='zero'||st(a)==='crit'}).length));
    }

    function bindCommon(){
      document.querySelectorAll('[data-tab], .rail-tab').forEach(function(btn){btn.onclick=function(){selCat=null;selSubcat=null;selItem=null;adjMode=null;adjVal='';adjNote='';pg=btn.getAttribute('data-tab');searchQ='';draw();if(pg==='search')setTimeout(function(){var x=document.getElementById('search-in');if(x)x.focus()},40)}});
      document.querySelectorAll('[data-cat]').forEach(function(btn){btn.onclick=function(){selCat=btn.getAttribute('data-cat');draw()}});
      document.querySelectorAll('[data-item]').forEach(function(btn){btn.onclick=function(){selItem=items.find(function(x){return x.id===btn.getAttribute('data-item')});if(selItem)draw()}});
      document.querySelectorAll('[data-home], #go-home-search, #go-home-alerts, #go-home-history, #go-home-report, #go-home-cat, #go-home-subcat, #go-home-item').forEach(function(btn){btn.onclick=function(){selCat=null;selSubcat=null;selItem=null;adjMode=null;pg='home';draw()}});
      var rs=document.getElementById('rail-sync'); if(rs) rs.onclick=function(){toast('Sincronizando...');sync()};
      var rl=document.getElementById('rail-logout'); if(rl) rl.onclick=function(){user=null;pg='login';draw()};
    },40)}});
      document.querySelectorAll('[data-cat]').forEach(function(btn){btn.onclick=function(){selCat=btn.getAttribute('data-cat');draw()}});
      document.querySelectorAll('[data-item]').forEach(function(btn){btn.onclick=function(){selItem=items.find(function(x){return x.id===btn.getAttribute('data-item')});if(selItem)draw()}});
      document.querySelectorAll('[data-home], #go-home-search, #go-home-alerts, #go-home-history, #go-home-report, #go-home-cat, #go-home-subcat, #go-home-item').forEach(function(btn){btn.onclick=function(){selCat=null;selSubcat=null;selItem=null;adjMode=null;pg='home';draw()}});
    }

    function generatePDF(){
      toast('Generando reporte...');
      setTimeout(function(){
        try{
          var p2=function(n){return('0'+n).slice(-2)};
          var now2=new Date();
          var ds=p2(now2.getDate())+'/'+p2(now2.getMonth()+1)+'/'+now2.getFullYear();
          var totalS=0; items.forEach(function(x){totalS+=x.stock});
          var critC=items.filter(function(x){return st(x)==='zero'||st(x)==='crit'}).length;
          var lowC=items.filter(function(x){return st(x)==='low'}).length;
          var h='<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Reporte Stock Kawas</title><style>';
          h+='@import url(https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap);';
          h+='*{margin:0;padding:0;box-sizing:border-box}body{font-family:Inter,Arial,sans-serif;background:#F9FAFB;color:#101828;padding:14mm;font-size:10px}@page{size:letter;margin:12mm}@media print{.no-print{display:none!important}}h1{font-size:24px;font-weight:800;letter-spacing:-.04em;margin-bottom:4px}.sub{font-size:12px;color:#667085;margin-bottom:18px}.print-btn{display:block;margin:0 auto 18px;padding:12px 24px;border:none;border-radius:12px;background:#7A5AF8;color:#fff;font-weight:700;cursor:pointer}.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:18px}.kpi{background:#fff;border:1px solid #EAECF0;border-radius:16px;padding:14px;box-shadow:0 1px 2px rgba(16,24,40,.05)}.kpi .v{font-size:26px;font-weight:800;letter-spacing:-.04em;margin-top:8px}.kpi .l{font-size:11px;color:#667085;font-weight:600}.danger{color:#F04438}.warn{color:#F79009}.success{color:#12B76A}.primary{color:#7A5AF8}h2{font-size:15px;font-weight:800;margin:20px 0 10px}h3{font-size:12px;font-weight:700;margin:14px 0 8px;color:#344054}table{width:100%;border-collapse:separate;border-spacing:0;margin-bottom:10px;background:#fff;border:1px solid #EAECF0;border-radius:14px;overflow:hidden}th,td{padding:9px 10px;border-bottom:1px solid #EAECF0;text-align:left}th{font-size:10px;color:#475467;background:#F9FAFB;font-weight:700}td{font-size:10px}tr:last-child td{border-bottom:none}.center{text-align:center}.section{margin-bottom:18px}.chip{display:inline-block;padding:5px 9px;border-radius:999px;font-size:10px;font-weight:700}.chip-ok{background:#ECFDF3;color:#027A48}.chip-low{background:#FFFAEB;color:#B54708}.chip-crit{background:#FEF3F2;color:#B42318}.footer{margin-top:18px;padding-top:10px;border-top:1px solid #EAECF0;font-size:9px;color:#98A2B3;text-align:center}';
          h+='</style></head><body><button class="no-print print-btn" onclick="window.print()">Guardar como PDF</button><h1>Kawas Stock Report</h1><div class="sub">'+ds+' · '+items.length+' productos · UI rediseñada</div>';
          h+='<div class="kpis"><div class="kpi"><div class="l">Productos</div><div class="v primary">'+items.length+'</div></div><div class="kpi"><div class="l">Stock total</div><div class="v">'+totalS.toLocaleString()+'</div></div><div class="kpi"><div class="l">Críticos</div><div class="v danger">'+critC+'</div></div><div class="kpi"><div class="l">Bajo mínimo</div><div class="v warn">'+lowC+'</div></div></div>';
          var critItems=items.filter(function(x){return st(x)!=='ok'}).sort(function(a,b){return a.stock-b.stock});
          if(critItems.length){h+='<div class="section"><h2>Productos con alerta</h2><table><tr><th>Producto</th><th>Categoría</th><th class="center">Stock</th><th class="center">Mínimo</th><th class="center">Estado</th><th class="center">Proyección</th></tr>';critItems.forEach(function(it){var proj=calcProjection(it);var badgeCls=st(it)==='low'?'chip-low':'chip-crit';h+='<tr><td>'+esc(it.name)+'</td><td>'+esc(it.cat)+(it.subcat?' · '+esc(it.subcat):'')+'</td><td class="center">'+it.stock+'</td><td class="center">'+it.min+'</td><td class="center"><span class="chip '+badgeCls+'">'+STC[st(it)].l+'</span></td><td class="center">'+(proj?esc(proj.days)+' días':'-')+'</td></tr>'});h+='</table></div>'}
          var groups={};items.forEach(function(it){if(!groups[it.cat])groups[it.cat]={};var sk=it.subcat||'General';if(!groups[it.cat][sk])groups[it.cat][sk]=[];groups[it.cat][sk].push(it)});
          Object.keys(groups).forEach(function(cat){h+='<div class="section"><h2>'+esc(cat)+'</h2>';Object.keys(groups[cat]).forEach(function(sc){if(sc!=='General')h+='<h3>'+esc(sc)+'</h3>';h+='<table><tr><th>Producto</th><th class="center">Stock</th><th class="center">Mínimo</th><th class="center">Estado</th><th class="center">Uso diario</th><th class="center">Días restantes</th><th class="center">Fecha estimada</th></tr>';groups[cat][sc].sort(function(a,b){return a.name>b.name?1:-1}).forEach(function(it){var proj=calcProjection(it),s=st(it),chip=s==='ok'?'chip-ok':s==='low'?'chip-low':'chip-crit';h+='<tr><td>'+esc(it.name)+'</td><td class="center">'+it.stock+'</td><td class="center">'+it.min+'</td><td class="center"><span class="chip '+chip+'">'+STC[s].l+'</span></td><td class="center">'+(proj?esc(proj.dailyUse):'-')+'</td><td class="center">'+(proj?esc(proj.days):'-')+'</td><td class="center">'+(proj?esc(proj.dateOut):'-')+'</td></tr>'});h+='</table>'});h+='</div>'});
          h+='<div class="footer">Kawas Coffee · Reporte generado desde el front end rediseñado</div></body></html>';
          var w=window.open('','_blank');
          if(w){w.document.write(h);w.document.close();toast('Reporte abierto - usa Guardar como PDF')} else {var blob=new Blob([h],{type:'text/html'});var url=URL.createObjectURL(blob);var a=document.createElement('a');a.href=url;a.download='reporte_stock_kawas_'+ds.replace(/\//g,'')+'.html';a.click();URL.revokeObjectURL(url);toast('Reporte descargado como HTML')}
        }catch(e){toast('Error: '+e.message,'err')}
      },100)
    }

    function draw(){
      var A=document.getElementById('app');
      var criticalAlerts=alerts().filter(function(a){return st(a)==='zero'||st(a)==='crit'}).length;
      var html='';
      if(toastMsg){html+='<div style="animation:toastin .24s ease" class="fixed left-1/2 top-5 z-[100] -translate-x-1/2 rounded-full px-4 py-2 text-xs font-semibold text-white shadow-lgsoft '+(toastT==='err'?'bg-error-700':toastT==='warn'?'bg-warning-700':'bg-success-700')+'">'+esc(toastMsg)+'</div>'}
      if(!user){A.innerHTML=html+renderLogin();var pin=document.getElementById('pin');if(pin){pin.focus();pin.oninput=function(){if(pin.disabled)return;pin.value=String(pin.value||'').replace(/\D/g,'').slice(0,4);if(pin.value.length===4){var pinAttempt=String(pin.value),firstTry=validatePinAttempt(pinAttempt);pin.disabled=true;if(firstTry.ok){completeLogin(firstTry.user);return}loadUsers(true).then(function(){var secondTry=validatePinAttempt(pinAttempt);if(secondTry.ok){completeLogin(secondTry.user)}else{pin.disabled=false;pin.value='';pin.focus();toast(authError?'PIN no encontrado. Revise hoja usuarios o deployment.':'PIN incorrecto','err')}}).catch(function(){pin.disabled=false;pin.value='';pin.focus();toast('No se pudo validar el PIN','err')})}}}return}
      if(selItem){A.innerHTML=html+renderDetail();bindCommon();document.getElementById('back-item').onclick=function(){selItem=null;adjMode=null;adjVal='';adjNote='';draw()};document.querySelectorAll('[data-adj]').forEach(function(btn){btn.onclick=function(){adjMode=btn.getAttribute('data-adj');draw();setTimeout(function(){var v=document.getElementById('adj-v');if(v)v.focus()},50)}});var adjC=document.getElementById('adj-cancel');if(adjC)adjC.onclick=function(){adjMode=null;adjVal='';adjNote='';draw()};var adjV=document.getElementById('adj-v');if(adjV){adjV.oninput=function(){adjVal=adjV.value};adjV.focus()}var adjN=document.getElementById('adj-n');if(adjN)adjN.oninput=function(){adjNote=adjN.value};var adjO=document.getElementById('adj-ok');if(adjO)adjO.onclick=function(){var v=parseInt(adjVal);if(isNaN(v)||v<0){toast('Valor inválido','err');return}var old=selItem.stock,ns;if(adjMode==='in')ns=old+v;else if(adjMode==='out')ns=Math.max(0,old-v);else ns=v;items=items.map(function(x){return x.id===selItem.id?Object.assign({},x,{stock:ns}):x});hist.unshift({id:selItem.id,nm:selItem.name,cat:selItem.cat,tp:adjMode==='in'?'ingreso':adjMode==='out'?'salida':'ajuste',os:old,ns:ns,nt:adjNote,u:user.n,ts:ts()});save();pushUpdate(selItem,old,ns,adjMode==='in'?'ingreso':adjMode==='out'?'salida':'ajuste',adjNote);selItem=Object.assign({},selItem,{stock:ns});adjMode=null;adjVal='';adjNote='';toast(selItem.name+': '+old+' → '+ns);draw()};return}
      if(selCat && !selSubcat){A.innerHTML=html+renderCategory();bindCommon();document.getElementById('back-cat').onclick=function(){selCat=null;draw()};document.getElementById('subcat-scroll').onclick=function(e){var t=e.target;while(t&&t.id!=='subcat-scroll'){if(t.hasAttribute&&t.hasAttribute('data-subcat')){selSubcat=t.getAttribute('data-subcat');draw();return}t=t.parentElement}};return}
      if(selCat && selSubcat){A.innerHTML=html+renderSubcategory();bindCommon();document.getElementById('back-subcat').onclick=function(){if(window.__hasMultipleSubs){selSubcat=null}else{selCat=null;selSubcat=null}draw()};return}
      if(pg==='home') A.innerHTML=html+renderHome();
      if(pg==='search') A.innerHTML=html+renderSearch();
      if(pg==='alerts') A.innerHTML=html+renderAlerts();
      if(pg==='history') A.innerHTML=html+renderHistory();
      if(pg==='report') A.innerHTML=html+renderReport();
      bindCommon();
      var lo=document.getElementById('logout');if(lo)lo.onclick=function(){user=null;pg='login';draw()};
      var sy=document.getElementById('do-sync');if(sy)sy.onclick=function(){toast('Sincronizando...');sync()};
      var ts2=document.getElementById('top-sync');if(ts2)ts2.onclick=function(){toast('Sincronizando...');sync()};
      var gp=document.getElementById('gen-pdf');if(gp)gp.onclick=function(){generatePDF()};
      var db=document.getElementById('open-db');if(db)db.onclick=function(){window.open(SHEET_URL,'_blank')};
      var si=document.getElementById('search-in');if(si){si.oninput=function(){searchQ=si.value;renderSearchResults()};setTimeout(renderSearchResults,0)}
    }

    var touchStartX=0,touchStartY=0;
    document.addEventListener('touchstart',function(e){touchStartX=e.touches[0].clientX;touchStartY=e.touches[0].clientY},{passive:true});
    document.addEventListener('touchend',function(e){
      var dx=e.changedTouches[0].clientX-touchStartX;var dy=Math.abs(e.changedTouches[0].clientY-touchStartY);
      if(dx>80&&dy<80){if(selItem){selItem=null;adjMode=null;adjVal='';adjNote='';draw()}else if(selSubcat){var sm2=subcatMap(selCat);if(Object.keys(sm2).length>1){selSubcat=null}else{selCat=null;selSubcat=null}draw()}else if(selCat){selCat=null;draw()}}
    },{passive:true});

    window.addEventListener('online',function(){authMessage='Conexión recuperada. Reintentando...';authError=false;loadUsers(true);if(user)sync()});
    window.addEventListener('offline',function(){authError=true;authMessage='Sin conexión a internet';safeRedraw();toast('Sin conexión: usando datos locales','warn')});
    window.addEventListener('error',function(e){console.error('window error',e&&e.error?e.error:e)});
    window.addEventListener('unhandledrejection',function(e){console.error('unhandled rejection',e&&e.reason?e.reason:e)});

    loadCachedUsers();
    draw();
    loadUsers(true);
  </script>
