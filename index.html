    Esta versión de la aplicación ha sido adaptada a un estilo
    totalmente inspirado en el kit **Snow UI Dashboard**. Se
    abandona la paleta Google para adoptar colores más suaves,
    superficies neutras y acentos pastel propios de Snow UI. A
    pesar del cambio estético, se conservan todas las
    funcionalidades de la PWA original. La estructura está
    construida sobre Tailwind CSS, extendida aquí con una paleta
    personalizada de tonos fríos, neutros y pasteles, radios
    moderados y sombras sutiles para transmitir claridad y
    modernidad. La intención es que la interfaz se sienta como un
    panel limpio y minimalista, típico de las dashboard UI kits
    contemporáneas, pero sin sacrificar la usabilidad ni el soporte
    táctil.

        --radius-sm: theme(borderRadius.sm);

        --radius-lg: theme(borderRadius.lg);

        @apply text-xs text-[--text-faint];

        @apply text-[#C7791A];

      .kpi-card.danger .kpi-value {

      .kpi-card.success .kpi-value {
        @apply text-[--success];

        color: var(--primary-strong);

      .soft-badge.info {
        background-color: var(--info-soft);
        color: var(--primary-strong);
        border-color: theme(colors.infoContainer);

      .soft-badge.success {
        background-color: var(--success-soft);
        color: var(--success);
        border-color: var(--success);
      }
      .soft-badge.warning {
        background-color: var(--warning-soft);
        color: var(--warning);

      .soft-badge.danger {
        background-color: var(--danger-soft);
        color: var(--danger);

      }

      }
      .btn {
        @apply inline-flex items-center justify-center gap-2 min-h-[48px] px-4 text-sm font-normal rounded-sm border bg-[--surface] text-[--text] border-[--stroke];
      }
      .btn-primary {

      }
      .btn-primary:hover {
        @apply bg-[--primary-strong];
      }
      .btn-secondary {
        @apply bg-white text-[--text-soft] border-[--stroke];
      }
      .btn-soft {

      }
      .btn-danger {

      }
      .icon-btn {

      .icon-btn.primary {

      }

        @apply flex items-center gap-2 bg-[--surface] border border-[--stroke] border-b-2 border-[--stroke] px-4 min-h-[48px] rounded-sm;
      }
      .input-wrap input {

      }
      .input-wrap input::placeholder {

        @apply absolute left-0 right-0 bottom-0 z-20;
      }
      .bottom-nav {
        @apply grid grid-cols-5 bg-[--surface] border-t border-[--stroke] shadow-sm;

function st(x){if(x.stock===0)return"zero";if(x.stock<x.min*.3)return"crit";if(x.stock<x.min)return"low";return"ok"}
// Colores de estado actualizados para Snow UI
var STC={zero:{l:"Agotado",c:"#DE3A47",b:"#FCEEEF"},crit:{l:"Crítico",c:"#DE3A47",b:"#FCEEEF"},low:{l:"Bajo",c:"#F5A623",b:"#FFF7E8"},ok:{l:"OK",c:"#2EAD68",b:"#E6F5EF"}};

function gc(c){
  // Selecciona un icono y color para una categoría determinada
  if(CC_KNOWN[c])return{i:CC_KNOWN[c].i,c:CC_KNOWN[c].c,s:c.length>14?c.substring(0,12)+"..":c};
  var fw=c.split(" ")[0];
  if(CC_KNOWN[fw])return{i:CC_KNOWN[fw].i,c:CC_KNOWN[fw].c,s:c.length>14?c.substring(0,12)+"..":c};
  var catKeys=Object.keys(catMap());
  var idx=catKeys.indexOf(c);
  if(idx<0)idx=catKeys.length;
  return{i:CC_ICONS[idx%CC_ICONS.length],c:CC_COLORS[idx%CC_COLORS.length],s:c.length>14?c.substring(0,12)+"..":c};
}
function ts(){var d=new Date(),p=function(n){return("0"+n).slice(-2)};return p(d.getDate())+"/"+p(d.getMonth()+1)+" "+p(d.getHours())+":"+p(d.getMinutes())}
function esc(s){return s==null?"":String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;")}
function alerts(){return items.filter(function(x){return st(x)!=="ok"}).sort(function(a,b){var o={zero:0,crit:1,low:2};return(o[st(a)]||3)-(o[st(b)]||3)})}
function catMap(){var m={};items.forEach(function(x){if(!m[x.cat])m[x.cat]=[];m[x.cat].push(x)});return m}
function subcatMap(catName){var m={};items.filter(function(x){return x.cat===catName}).forEach(function(x){var sc=x.subcat||"General";if(!m[sc])m[sc]=[];m[sc].push(x)});return m}
function save(){try{localStorage.setItem("kw4",JSON.stringify({items:items,hist:hist}))}catch(e){}}
function load(){try{var d=JSON.parse(localStorage.getItem("kw4"));if(d&&d.items&&d.items.length>0){items=d.items;hist=d.hist||[]}else{items=JSON.parse(JSON.stringify(ITEMS));hist=[]}}catch(e){items=JSON.parse(JSON.stringify(ITEMS));hist=[]}}
function isOnline(){return API_URL!=="DEMO"&&API_URL!=="TU_URL_AQUI"&&API_URL!==""}
function normalizeUsers(arr){
  return (arr||[]).map(function(u){
    return {n:String(u.nombre||u.n||'Usuario').trim(),p:String(u.pin||u.p||'').trim()};
  }).filter(function(u){return u.n&&u.p});
}
function loadCachedUsers(){
  try{
    var raw=localStorage.getItem(AUTH_CACHE_KEY);
    if(!raw)return [];
    var parsed=JSON.parse(raw);
    var users=normalizeUsers(parsed);
    if(users.length){
      AUTH_USERS=users;
      authSource='cache';
      authMessage='Usuarios cargados desde caché local';
    }
    return users;
  }catch(e){
    return [];
  }
}
function saveCachedUsers(users){
  try{localStorage.setItem(AUTH_CACHE_KEY,JSON.stringify(users||[]))}catch(e){}
}

function buildApiUrl(params){
  var q=Object.keys(params||{}).map(function(k){return encodeURIComponent(k)+'='+encodeURIComponent(params[k])}).join('&');
  return API_URL+(API_URL.indexOf('?')>-1?'&':'?')+q;
}
function fetchTextWithTimeout(url,opts,timeoutMs){
  timeoutMs=timeoutMs||12000;
  return new Promise(function(resolve,reject){
    var done=false;
    var t=setTimeout(function(){if(done)return;done=true;reject(new Error('Timeout '+timeoutMs+'ms'))},timeoutMs);
    fetch(url,opts||{}).then(function(r){
      if(done)return;
      clearTimeout(t);
      done=true;
      resolve(r);
    }).catch(function(err){
      if(done)return;
      clearTimeout(t);
      done=true;
      reject(err);
    });
  });
}
function fetchJsonWithTimeout(url,opts,timeoutMs){
  return fetchTextWithTimeout(url,opts,timeoutMs).then(function(r){
    if(!r.ok) throw new Error('HTTP '+r.status);
    return r.text();
  }).then(function(txt){
    try{return JSON.parse(txt)}catch(parseErr){
      throw new Error('Respuesta no JSON desde Apps Script');
    }
  });
}
