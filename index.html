            primary: {25:'#FCFAFF',50:'#F9F5FF',100:'#F4EBFF',200:'#E9D7FE',300:'#D6BBFB',400:'#B692F6',500:'#9E77ED',600:'#7F56D9',700:'#6941C6',800:'#53389E',900:'#42307D'},

  <style>
    :root{--app-bg:#F9FAFB;--app-text:#101828;--safe-top:env(safe-area-inset-top,0px);--safe-bottom:env(safe-area-inset-bottom,0px)}
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    html,body{margin:0;background:var(--app-bg);color:var(--app-text);font-family:Inter,system-ui,sans-serif;min-height:100%;overflow-x:hidden}
    body{padding-bottom:calc(88px + var(--safe-bottom))}
    .material-symbols-rounded{font-variation-settings:'FILL' 0,'wght' 500,'GRAD' 0,'opsz' 24}
    .mn{font-variant-numeric:tabular-nums}
    .glass{backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
    .fade-up{animation:fadeUp .24s ease both}
    @keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
    @keyframes toastin{from{opacity:0;transform:translate(-50%,-8px)}to{opacity:1;transform:translate(-50%,0)}}
    .safe-top{padding-top:max(20px,calc(16px + var(--safe-top)))}
    .safe-bottom{padding-bottom:max(16px,calc(12px + var(--safe-bottom)))}
    .bottom-shadow{box-shadow:0 -8px 32px rgba(16,24,40,.08)}
    .gradient-shell{background:radial-gradient(circle at top left, rgba(127,86,217,.18), transparent 34%),radial-gradient(circle at top right, rgba(23,92,211,.12), transparent 26%),#F9FAFB}
    .line-clamp-2{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
    .app-shell-grid{display:grid;grid-template-columns:minmax(0,1fr);min-height:100vh}
    .app-shell-rail{display:none}
    .sticky-blur{position:sticky;top:0;z-index:20;background:linear-gradient(180deg,rgba(249,250,251,.96),rgba(249,250,251,.82) 76%,rgba(249,250,251,0));backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
    .pill-scroll{display:flex;gap:10px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
    .pill-scroll::-webkit-scrollbar{display:none}
    @media (min-width:980px){
      body{padding-bottom:32px}
      .app-shell-grid{grid-template-columns:300px minmax(0,1fr);gap:24px;max-width:1440px;margin:0 auto;padding:24px 24px 32px}
      .app-shell-rail{display:block;position:sticky;top:24px;height:calc(100vh - 48px)}
      .mobile-bottom-nav{display:none}
      .safe-top{padding-top:0}
    }
  </style>
</head>
<body class="gradient-shell">

  <script>
var BUILD_CERTIFIED="2026-04-18 ad-hoc-icons";
var API_URL="https://script.google.com/macros/s/AKfycbz5A3aHqNYssPewIyMBqIrfNUV3HijwI3MfCSuqv8Xv2YMkX1RKNwZFCP0tjgba-85oYw/exec";
var SHEET_URL="https://docs.google.com/spreadsheets/d/1eF4MZHXzz_UQOvNbni-g0ljoD1fJIeg_QsHG8H6ievo/edit";

var ITEMS=[
{id:"e1",cat:"Etiquetas Adhesivas",subcat:"1Kg Funsmart 90×60",name:"Espresso Original",stock:600,min:100,unit:"uds",alert:""},
{id:"e2",cat:"Etiquetas Adhesivas",subcat:"1Kg Funsmart 90×60",name:"Espresso Frutal",stock:142,min:150,unit:"uds",alert:"Pedir pronto"},
{id:"e3",cat:"Etiquetas Adhesivas",subcat:"1Kg Funsmart 90×60",name:"Bolivia Caranavi Regional",stock:230,min:200,unit:"uds",alert:"Pedir pronto"},
{id:"b1",cat:"Bolsas",subcat:"MTPACK Impresas",name:"MTPACK Impresas 250g",stock:75,min:500,unit:"uds",alert:""},
{id:"b2",cat:"Bolsas",subcat:"Funsmart",name:"Funsmart Blancas 1Kg",stock:800,min:300,unit:"uds",alert:""},
{id:"c1",cat:"Cajas",subcat:"Kawas Grandes",name:"Caja Kawas SYT 12KG",stock:1850,min:500,unit:"uds",alert:""},
{id:"c2",cat:"Cajas",subcat:"Kawas Grandes",name:"Cajas formato nuevo 58x30x21",stock:41,min:50,unit:"uds",alert:"Crítico"},
{id:"c3",cat:"Cajas",subcat:"Kawas Grandes",name:"Cajas 30x20x20 Castaño",stock:150,min:100,unit:"uds",alert:""},
{id:"p1",cat:"Empaque y Despacho",subcat:"",name:"Bolsa Kraft Pequeña 20x30x10",stock:117,min:50,unit:"uds",alert:""},
{id:"p2",cat:"Empaque y Despacho",subcat:"",name:"Cinta embalaje Plástica",stock:24,min:30,unit:"rollos",alert:"Pedir"},
{id:"cb1",cat:"Cold Brew",subcat:"Botellas y Tapas",name:"Botellas transparentes 200ml",stock:12,min:50,unit:"uds",alert:"Pedir urgente"},
{id:"o1",cat:"Otros",subcat:"Sellos Kawas",name:"Sello Redondo 50x50",stock:0,min:50,unit:"uds",alert:""},
{id:"m1",cat:"Molinos profesionales",subcat:"Eureka",name:"Eureka Atom 75",stock:2,min:1,unit:"uds",alert:"",family:"Mercadería",stockList:"Equipamiento"},
{id:"m2",cat:"Cafeteras",subcat:"Rocket",name:"Rocket Appartamento",stock:1,min:1,unit:"uds",alert:"",family:"Mercadería",stockList:"Equipamiento"},
{id:"bf1",cat:"Botellas y Tapas",subcat:"Tapas negras",name:"Tapas negras 200ml",stock:332,min:100,unit:"uds",alert:"",family:"Bebidas Frías",stockList:"Sala Bebidas Frías"},
{id:"cv1",cat:"Lotes",subcat:"Guatemala",name:"Guatemala Huehuetenango",stock:8,min:3,unit:"sacos",alert:"",family:"Café Verde",stockList:"Stock Café Verde"}
];

var CATEGORY_META={
  "Etiquetas Adhesivas":{icon:"label",color:"#175CD3"},
  "Bolsas":{icon:"shopping_bag",color:"#079455"},
  "Cajas":{icon:"inventory_2",color:"#B42318"},
  "Empaque y Despacho":{icon:"local_shipping",color:"#B54708"},
  "Cold Brew":{icon:"local_bar",color:"#0E9384"},
  "Otros":{icon:"category",color:"#667085"},
  "Molinos profesionales":{icon:"settings",color:"#175CD3"},
  "Cafeteras":{icon:"coffee_maker",color:"#7F56D9"},
  "Botellas y Tapas":{icon:"liquor",color:"#175CD3"},
  "Lotes":{icon:"grain",color:"#079455"}
};

var FAMILY_THEMES={
  "Kawas General":{accent:"#7F56D9",soft:"#F4EBFF",softBorder:"#E9D7FE",text:"#6941C6",icon:"warehouse"},
  "Clientes Especiales":{accent:"#B42318",soft:"#FEF3F2",softBorder:"#FECDCA",text:"#B42318",icon:"storefront"},
  "Mercadería":{accent:"#175CD3",soft:"#EFF8FF",softBorder:"#B2DDFF",text:"#175CD3",icon:"shopping_bag"},
  "Bebidas Frías":{accent:"#0E9384",soft:"#ECFDF3",softBorder:"#A6F4C5",text:"#027A48",icon:"local_bar"},
  "Café Verde":{accent:"#079455",soft:"#ECFDF3",softBorder:"#ABEFC6",text:"#027A48",icon:"grain"},
  "Sin familia":{accent:"#667085",soft:"#F2F4F7",softBorder:"#D0D5DD",text:"#475467",icon:"inventory_2"}
};

var USERS=[{n:"Admin",p:"1234"},{n:"Bodega",p:"5678"},{n:"Producción",p:"9012"}],AUTH_CACHE_KEY='kw4_auth_users',AUTH_USERS=[];
var authLoaded=false,authLoading=false,authError=false,authPromise=null,syncCounter=0;
var items=[],hist=[],user=null,pg='login',selFamily=null,selStockList=null,selItem=null,adjMode=null,adjVal='',adjNote='',searchQ='',toastMsg=null,toastT='ok',loginPin='',loginBusy=false,histFilterQuery='',histFilterType='all',histSortKey='ts',histSortDir='desc',stockListSearchQ='';

var TOP_LEVEL_TABS=['home','search','alerts','history','report'];
var touchStartX=0,touchStartY=0,touchStartTarget=null,touchStartScrollable=null;

function esc(s){return s==null?'':String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function ts(){var d=new Date(),p=n=>("0"+n).slice(-2);return p(d.getDate())+'/'+p(d.getMonth()+1)+' '+p(d.getHours())+':'+p(d.getMinutes())}
function st(x){if(x.stock===0)return'zero';if(x.stock<x.min*.3)return'crit';if(x.stock<x.min)return'low';return'ok'}
var STC={zero:{l:'Agotado'},crit:{l:'Crítico'},low:{l:'Bajo'},ok:{l:'OK'}};

function ft(family){return FAMILY_THEMES[family]||FAMILY_THEMES["Sin familia"]}
function cm(cat){return CATEGORY_META[cat]||{icon:"category",color:"#7F56D9"}}

function familyCardStyle(family){
  var t=ft(family);
  return 'border-color:'+t.softBorder+';background:linear-gradient(180deg,'+t.soft+',#ffffff);';
}
function familyChipStyle(family,active){
  var t=ft(family);
  return active
    ? 'border-color:'+t.accent+';background:'+t.soft+';color:'+t.text+';'
    : 'border-color:'+t.softBorder+';background:#ffffff;color:'+t.text+';';
}
function familyMetricStyle(family){
  var t=ft(family);
  return 'border-color:'+t.softBorder+';background:'+t.soft+';';
}
function familyIconStyle(family){
  var t=ft(family);
  return 'color:'+t.accent+';border-color:'+t.softBorder+';background:'+t.soft+';';
}
function familyTextStyle(family){
  return 'color:'+ft(family).text+';';
}
function familyBarColor(family){return ft(family).accent}
function categoryIconStyle(cat){
  var c=cm(cat);
  return 'color:'+c.color+';border-color:#EAECF0;background:#F9FAFB;';
}

function statusTheme(s){
  if(s==='ok')return{soft:'bg-success-50 text-success-700 border-green-200',bar:'#12B76A',text:'text-success-700'};
  if(s==='low')return{soft:'bg-warning-50 text-warning-700 border-amber-200',bar:'#F79009',text:'text-warning-700'};
  return{soft:'bg-error-50 text-error-700 border-red-200',bar:'#F04438',text:'text-error-700'};
}

function alerts(){return items.filter(function(x){return st(x)!=='ok'}).sort(function(a,b){return({zero:0,crit:1,low:2,ok:3}[st(a)]-({zero:0,crit:1,low:2,ok:3}[st(b)]))})}
function familyMap(){var m={};items.forEach(function(x){var f=x.family||'Sin familia';if(!m[f])m[f]=[];m[f].push(x)});return m}
function stockListMap(familyName){var m={};items.filter(function(x){return (x.family||'Sin familia')===familyName}).forEach(function(x){var sl=x.stockList||'General';if(!m[sl])m[sl]=[];m[sl].push(x)});return m}
function categoryMapForStockList(familyName,stockListName){var m={};items.filter(function(x){return (x.family||'Sin familia')===familyName && (x.stockList||'General')===stockListName}).forEach(function(x){var c=x.cat||'General';if(!m[c])m[c]=[];m[c].push(x)});return m}

function enrichItem(x){
  var name=String(x.name||x.nombre||'');
  var cat=String(x.cat||x.categoria||'');
  var family=x.family||x.familia||(
    /castaño|castano/i.test(name)?'Clientes Especiales':
    (cat==='Cold Brew'?'Bebidas Frías':'Kawas General')
  );
  var stockList=x.stockList||x.lista_stock||(
    /castaño|castano/i.test(name)?'Stock Castaño':
    (cat==='Cold Brew'?'Sala Bebidas Frías':'Stock General Kawas')
  );
  return {
    id:String(x.id||''),
    family:String(family||''),
    stockList:String(stockList||''),
    cat:cat,
    subcat:String(x.subcat||x.subcategoria||''),
    name:String(x.name||x.nombre||''),
    stock:Number(x.stock)||0,
    min:Number(x.min||x.minimo)||0,
    unit:String(x.unit||x.unidad||'uds'),
    alert:String(x.alert||x.alerta||'')
  };
}

function save(){try{localStorage.setItem('kw4',JSON.stringify({items:items,hist:hist}))}catch(e){}}
function load(){
  try{
    var d=JSON.parse(localStorage.getItem('kw4'));
    if(d&&d.items&&d.items.length>0){items=d.items.map(enrichItem);hist=d.hist||[]}
    else{items=ITEMS.map(enrichItem);hist=[]}
  }catch(e){items=ITEMS.map(enrichItem);hist=[]}
}
function isOnline(){return API_URL!==''&&API_URL!=='DEMO'&&API_URL!=='TU_URL_AQUI'}
function normalizeUsers(arr){return(arr||[]).map(function(u){return{n:String(u.nombre||u.n||'Usuario').trim(),p:String(u.pin||u.p||'').trim()}}).filter(function(u){return u.n&&u.p})}
function loadCachedUsers(){try{var raw=localStorage.getItem(AUTH_CACHE_KEY);if(!raw)return[];var parsed=JSON.parse(raw),users=normalizeUsers(parsed);if(users.length)AUTH_USERS=users;return users}catch(e){return[]}}
function saveCachedUsers(users){try{localStorage.setItem(AUTH_CACHE_KEY,JSON.stringify(users||[]))}catch(e){}}
function buildApiUrl(params){var q=Object.keys(params||{}).map(function(k){return encodeURIComponent(k)+'='+encodeURIComponent(params[k])}).join('&');return API_URL+(API_URL.indexOf('?')>-1?'&':'?')+q}
function fetchTextWithTimeout(url,opts,timeoutMs){timeoutMs=timeoutMs||12000;return new Promise(function(resolve,reject){var done=false;var t=setTimeout(function(){if(done)return;done=true;reject(new Error('Timeout '+timeoutMs+'ms'))},timeoutMs);fetch(url,opts||{}).then(function(r){if(done)return;clearTimeout(t);done=true;resolve(r)}).catch(function(err){if(done)return;clearTimeout(t);done=true;reject(err)})})}
function fetchJsonWithTimeout(url,opts,timeoutMs){return fetchTextWithTimeout(url,opts,timeoutMs).then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);return r.text()}).then(function(txt){try{return JSON.parse(txt)}catch(e){throw new Error('Respuesta no JSON desde Apps Script')}})}
function toast(m,t){toastMsg=m;toastT=t||'ok';safeDraw();clearTimeout(window.__toastTm);window.__toastTm=setTimeout(function(){toastMsg=null;safeDraw()},2200)}

function loadUsers(force){
  if(authLoading&&authPromise)return authPromise;
  if(authLoaded&&!force&&AUTH_USERS.length)return Promise.resolve(AUTH_USERS);
  if(!isOnline()){
    authLoaded=true;authError=true;
    AUTH_USERS=AUTH_USERS.length?AUTH_USERS:USERS.slice();
    return Promise.resolve(AUTH_USERS);
  }
  authLoading=true;
  authPromise=fetchJsonWithTimeout(buildApiUrl({action:'getUsers',_ts:Date.now()}),{cache:'no-store'},12000).then(function(d){
    if(d&&d.success&&d.users&&d.users.length){
      AUTH_USERS=normalizeUsers(d.users);
      saveCachedUsers(AUTH_USERS);
      authError=false;
    }else throw new Error('getUsers no devolvió usuarios');
    authLoaded=true;authLoading=false;authPromise=null;
    return AUTH_USERS;
  }).catch(function(){
    authLoaded=true;authLoading=false;authError=true;authPromise=null;
    AUTH_USERS=AUTH_USERS.length?AUTH_USERS:USERS.slice();
    return AUTH_USERS;
  });
  return authPromise;
}

function validatePinAttempt(pinAttempt){
  var seen={},pool=[];
  (AUTH_USERS||[]).concat(USERS||[]).forEach(function(x){if(!x||x.p==null)return;var k=String(x.p);if(seen[k])return;seen[k]=true;pool.push(x)});
  var u=pool.find(function(x){return String(x.p)===String(pinAttempt)});
  return u?{ok:true,user:u}:{ok:false};
}
function completeLogin(u){loginBusy=false;loginPin='';user=u;load();pg='home';safeDraw();sync();toast('Hola, '+u.n)}
function attemptLogin(pinAttempt){
  if(loginBusy)return;
  var attempt=String(pinAttempt||loginPin||'').replace(/\D/g,'').slice(0,4);
  if(attempt.length!==4)return;
  loginBusy=true;
  var firstTry=validatePinAttempt(attempt);
  if(firstTry.ok){completeLogin(firstTry.user);return}
  loadUsers(true).then(function(){
    var secondTry=validatePinAttempt(attempt);
    if(secondTry.ok){completeLogin(secondTry.user)}
    else{loginBusy=false;loginPin='';draw();toast('PIN incorrecto','err')}
  }).catch(function(){loginBusy=false;loginPin='';draw();toast('No se pudo validar el PIN','err')})
}

function sync(){
  if(!isOnline()){save();return Promise.resolve(false)}
  var syncId=++syncCounter;
  var stockReq=fetchJsonWithTimeout(buildApiUrl({action:'getAll',_ts:Date.now()}),{cache:'no-store'},15000).then(function(d){
    if(!(d&&d.success&&d.items))throw new Error('getAll inválido');
    return d.items.map(enrichItem);
  });
  var histReq=fetchJsonWithTimeout(buildApiUrl({action:'getHistory',limit:100,_ts:Date.now()}),{cache:'no-store'},15000).then(function(d){
    if(!(d&&d.success&&d.entries))throw new Error('getHistory inválido');
    return d.entries.map(function(x){
      return{
        id:String(x.itemId||x.item_id||x.id||''),
        nm:String(x.itemNombre||x.item_nombre||x.nm||''),
        cat:String(x.categoria||x.cat||''),
        tp:String(x.tipo||x.tp||''),
        os:Number(x.stockAnterior!=null?x.stockAnterior:(x.stock_anterior!=null?x.stock_anterior:x.os))||0,
        ns:Number(x.stockNuevo!=null?x.stockNuevo:(x.stock_nuevo!=null?x.stock_nuevo:x.ns))||0,
        nt:String(x.nota||x.nt||''),
        u:String(x.usuario||x.u||'?'),
        ts:x.timestamp?String(x.timestamp).substring(0,16).replace('T',' '):(x.ts||'')
      }
    })
  });
  return Promise.allSettled([stockReq,histReq]).then(function(results){
    if(syncId!==syncCounter)return false;
    var stockOk=results[0].status==='fulfilled',histOk=results[1].status==='fulfilled';
    if(stockOk)items=results[0].value;
    if(histOk)hist=results[1].value;
    if(stockOk||histOk){save();safeDraw();toast('Sincronización completada')}
    if(!stockOk&&!histOk)toast('No se pudo sincronizar con Apps Script','warn');
    else if(!stockOk||!histOk)toast('Sincronización parcial','warn');
    return stockOk||histOk;
  }).catch(function(){toast('No se pudo sincronizar','warn');return false})
}

function pushUpdate(item,oldStock,newStock,type,note){
  if(!isOnline()){save();toast('Sin conexión: cambio guardado localmente','warn');return Promise.resolve(false)}
  var body=JSON.stringify({action:'updateStock',itemId:item.id,newStock:newStock,oldStock:oldStock,tipo:type,usuario:user?user.n:'?',nota:note||''});
  return fetchJsonWithTimeout(API_URL,{method:'POST',body:body,headers:{'Content-Type':'text/plain'}},15000).then(function(d){
    if(d&&d.success){toast('Guardado en Sheets');return true}
    toast('Error al guardar','err');return false
  }).catch(function(){toast('Error de red - guardado local','warn');return false})
}

function badge(label,cls,icon){return'<span class="inline-flex items-center gap-1 rounded-full border px-2.5 py-1 text-[11px] font-semibold '+cls+'">'+(icon?'<span class="material-symbols-rounded text-[14px]">'+icon+'</span>':'')+esc(label)+'</span>'}
function familyBadge(family){
  var t=ft(family||'Sin familia');
  return '<span class="inline-flex items-center gap-1 rounded-full border px-2.5 py-1 text-[11px] font-semibold" style="border-color:'+t.softBorder+';background:'+t.soft+';color:'+t.text+'"><span class="material-symbols-rounded text-[14px]">'+t.icon+'</span>'+esc(family||'Sin familia')+'</span>';
}
function statusBadge(item){var s=st(item),th=statusTheme(s);return badge(STC[s].l,th.soft,s==='ok'?'check_circle':s==='low'?'warning':'error')}
function progressBar(item,barColor){var pct=item.min>0?Math.min(100,Math.round(item.stock/item.min*100)):100,th=statusTheme(st(item));return'<div class="mt-3"><div class="h-2 rounded-full bg-gray-100 overflow-hidden"><div class="h-full rounded-full" style="width:'+pct+'%;background:'+(barColor||th.bar)+'"></div></div><div class="mt-2 flex items-center justify-between text-[11px] text-gray-500"><span>Mínimo '+item.min+' '+esc(item.unit)+'</span><span>'+pct+'%</span></div></div>'}
function topIconButton(id,icon,primary,label){
  return '<button id="'+id+'" class="'+(primary?'bg-primary-600 text-white border-primary-600':'bg-white text-gray-700 border-gray-200')+' inline-flex h-11 items-center justify-center gap-2 rounded-2xl border px-3 shadow-soft"><span class="material-symbols-rounded text-[20px]">'+icon+'</span>'+(label?'<span class="hidden sm:inline text-sm font-semibold">'+esc(label)+'</span>':'')+'</button>';
}
function sectionHeader(eyebrow,title,subtitle,actions){
  var rs=(actions&&actions.right?actions.right:'');

function getSearchMatches(raw){
  function norm(v){return String(v||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim()}
  var q=norm(raw),terms=q.split(/\s+/).filter(Boolean);
  if(!q)return[];
  function searchableText(i){return norm([i.name,i.family,i.stockList,i.cat,i.subcat,i.unit,i.alert,i.id].join(' '))}
  function scoreItem(i){
    var name=norm(i.name),family=norm(i.family),stockList=norm(i.stockList),cat=norm(i.cat),subcat=norm(i.subcat),alert=norm(i.alert),all=searchableText(i),score=0;
    if(name===q)score+=120;
    if(stockList===q)score+=110;
    if(cat===q)score+=100;
    if(subcat===q)score+=100;
    if(family===q)score+=95;
    if(name.indexOf(q)===0)score+=80;
    if(stockList.indexOf(q)===0)score+=70;
    if(cat.indexOf(q)===0)score+=65;
    if(subcat.indexOf(q)===0)score+=65;
    if(family.indexOf(q)===0)score+=60;
    if(name.indexOf(q)!==-1)score+=50;
    if(stockList.indexOf(q)!==-1)score+=45;
    if(cat.indexOf(q)!==-1)score+=40;
    if(subcat.indexOf(q)!==-1)score+=40;
    if(family.indexOf(q)!==-1)score+=35;
    if(alert.indexOf(q)!==-1)score+=20;
    if(all.indexOf(q)!==-1)score+=10;
    var matchedTerms=0;
    terms.forEach(function(t){
      if(all.indexOf(t)!==-1){matchedTerms++;score+=8}
      if(name.indexOf(t)!==-1)score+=4;
      if(stockList.indexOf(t)!==-1)score+=3;
      if(cat.indexOf(t)!==-1)score+=3;
      if(subcat.indexOf(t)!==-1)score+=3;
      if(family.indexOf(t)!==-1)score+=2;
    });
    return{score:score,matchedTerms:matchedTerms}
  }
  return items.map(function(i){var meta=scoreItem(i);return{item:i,score:meta.score,matchedTerms:meta.matchedTerms}})
    .filter(function(x){return x.score>0 && x.matchedTerms===terms.length})
    .sort(function(a,b){var order={zero:0,crit:1,low:2,ok:3},sa=order[st(a.item)],sb=order[st(b.item)];if(sa!==sb)return sa-sb;if(b.score!==a.score)return b.score-a.score;if(a.item.stock!==b.item.stock)return a.item.stock-b.item.stock;return a.item.name>b.item.name?1:-1})
    .map(function(x){return x.item});
}

function getStockListMatches(familyName, stockListName, raw){
  function norm(v){return String(v||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim()}
  var q=norm(raw||''),terms=q.split(/\s+/).filter(Boolean);
  var base=items.filter(function(x){return (x.family||'Sin familia')===familyName && (x.stockList||'General')===stockListName});
  if(!q){
    return base.slice().sort(function(a,b){
      var order={zero:0,crit:1,low:2,ok:3},sa=order[st(a)],sb=order[st(b)];
      if(sa!==sb)return sa-sb;
      if(a.stock!==b.stock)return a.stock-b.stock;
      return (a.name||'').localeCompare(b.name||'');
    });
  }
  function searchableText(i){return norm([i.name,i.cat,i.subcat,i.unit,i.alert,i.id].join(' '))}
  function scoreItem(i){
    var name=norm(i.name),cat=norm(i.cat),subcat=norm(i.subcat),alert=norm(i.alert),all=searchableText(i),score=0;
    if(name===q)score+=120;
    if(cat===q)score+=105;
    if(subcat===q)score+=100;
    if(name.indexOf(q)===0)score+=80;
    if(cat.indexOf(q)===0)score+=70;
    if(subcat.indexOf(q)===0)score+=70;
    if(name.indexOf(q)!==-1)score+=50;
    if(cat.indexOf(q)!==-1)score+=40;
    if(subcat.indexOf(q)!==-1)score+=40;
    if(alert.indexOf(q)!==-1)score+=20;
    if(all.indexOf(q)!==-1)score+=10;
    var matchedTerms=0;
    terms.forEach(function(t){
      if(all.indexOf(t)!==-1){matchedTerms++;score+=8}
      if(name.indexOf(t)!==-1)score+=4;
      if(cat.indexOf(t)!==-1)score+=3;
      if(subcat.indexOf(t)!==-1)score+=3;
    });
    return{score:score,matchedTerms:matchedTerms};
  }
  return base.map(function(i){var meta=scoreItem(i);return{item:i,score:meta.score,matchedTerms:meta.matchedTerms}})
    .filter(function(x){return x.score>0 && x.matchedTerms===terms.length})
    .sort(function(a,b){
      var order={zero:0,crit:1,low:2,ok:3},sa=order[st(a.item)],sb=order[st(b.item)];
      if(sa!==sb)return sa-sb;
      if(b.score!==a.score)return b.score-a.score;
      if(a.item.stock!==b.item.stock)return a.item.stock-b.item.stock;
      return (a.item.name||'').localeCompare(b.item.name||'');
    })
    .map(function(x){return x.item});
}

ily)+'">'+pct+'%</div><div class="mt-1 text-xs text-gray-500">del mínimo</div></div><div class="rounded-[24px] border border-gray-200 bg-white/80 p-4"><div class="text-[11px] font-semibold uppercase tracking-[0.06em] text-gray-500">Estado</div><div class="mt-2">'+statusBadge(si)+'</div></div></div><div class="mt-5 h-2 overflow-hidden rounded-full bg-gray-100"><div class="h-full rounded-full" style="width:'+pct+'%;background:'+theme.accent+'"></div></div><div class="mt-2 flex items-center justify-between text-[11px] text-gray-500"><span>Stock mínimo: '+si.min+' '+esc(si.unit)+'</span><span>'+pct+'%</span></div></section></div><div class="space-y-4">'+(!adjMode?'<section class="rounded-[32px] border p-4 shadow-soft" style="'+familyCardStyle(si.family)+'"><div class="mb-3"><div class="text-lg font-semibold" style="'+familyTextStyle(si.family)+'">Modifica Stock</div><div class="text-sm text-gray-600">Ingresos, salidas y ajustes.</div></div><div class="grid grid-cols-1 gap-3"><button data-adj="in" class="rounded-[28px] border p-4 text-left shadow-soft" style="'+familyMetricStyle(si.family)+'"><div class="flex items-center gap-3"><div class="flex h-12 w-12 items-center justify-center rounded-2xl" style="background:'+theme.soft+';color:'+theme.accent+'"><span class="material-symbols-rounded">south_west</span></div><div><div class="text-[15px] font-semibold" style="'+familyTextStyle(si.family)+'">Ingreso</div><div class="text-sm text-gray-500">Suma unidades al stock actual</div></div></div></button><button data-adj="out" class="rounded-[28px] border border-red-200 bg-white p-4 text-left shadow-soft"><div class="flex items-center gap-3"><div class="flex h-12 w-12 items-center justify-center rounded-2xl bg-error-50 text-error-700"><span class="material-symbols-rounded">north_east</span></div><div><div class="text-[15px] font-semibold text-gray-900">Salida</div><div class="text-sm text-gray-500">Descuenta unidades del inventario</div></div></div></button><button data-adj="set" class="rounded-[28px] border p-4 text-left shadow-soft" style="'+familyMetricStyle(si.family)+'"><div class="flex items-center gap-3"><div class="flex h-12 w-12 items-center justify-center rounded-2xl" style="background:'+theme.soft+';color:'+theme.accent+'"><span class="material-symbols-rounded">edit_square</span></div><div><div class="text-[15px] font-semibold" style="'+familyTextStyle(si.family)+'">Ajustar</div><div class="text-sm text-gray-500">Define un stock manual</div></div></div></button></div></section>':'<section class="rounded-[32px] border p-4 shadow-soft" style="'+familyCardStyle(si.family)+'"><div class="text-lg font-semibold" style="'+familyTextStyle(si.family)+'">'+(adjMode==='in'?'Registrar ingreso':adjMode==='out'?'Registrar salida':'Ajustar stock')+'</div><div class="mt-4 space-y-3"><div class="rounded-2xl border px-4 py-3" style="'+familyMetricStyle(si.family)+'"><input id="adj-v" type="number" inputmode="numeric" class="w-full border-none bg-transparent text-sm outline-none placeholder:text-gray-400" placeholder="'+(adjMode==='set'?'Nuevo stock':'Cantidad')+'" value="'+esc(adjVal)+'"></div><div class="rounded-2xl border border-gray-200 bg-white px-4 py-3"><input id="adj-n" class="w-full border-none bg-transparent text-sm outline-none placeholder:text-gray-400" placeholder="Nota opcional" value="'+esc(adjNote)+'"></div><div class="grid grid-cols-2 gap-3"><button id="adj-cancel" class="rounded-2xl border border-gray-200 bg-white px-4 py-3 text-sm font-semibold text-gray-700">Cancelar</button><button id="adj-ok" class="rounded-2xl px-4 py-3 text-sm font-semibold text-white" style="background:'+theme.accent+'">Confirmar</button></div></div></section>')+'</div></div></div></main>';
  return appShell(inner,navHtml(pg,alerts().filter(function(a){return st(a)==='zero'||st(a)==='crit'}).length))
}

function bindCommon(){
  document.querySelectorAll('[data-tab], .rail-tab').forEach(function(btn){btn.onclick=function(){selFamily=null;selStockList=null;selItem=null;adjMode=null;adjVal='';adjNote='';pg=btn.getAttribute('data-tab');searchQ='';stockListSearchQ='';draw();if(pg==='search')setTimeout(function(){var x=document.getElementById('search-in');if(x)x.focus()},40)}});
  document.querySelectorAll('[data-family]').forEach(function(btn){btn.onclick=function(){selFamily=btn.getAttribute('data-family');stockListSearchQ='';draw()}});
  document.querySelectorAll('[data-stocklist]').forEach(function(btn){btn.onclick=function(){selStockList=btn.getAttribute('data-stocklist');stockListSearchQ='';draw()}});
  document.querySelectorAll('[data-item]').forEach(function(btn){btn.onclick=function(){selItem=items.find(function(x){return x.id===btn.getAttribute('data-item')});if(selItem)draw()}});
  var hs=document.getElementById('header-search');
  if(hs)hs.onclick=function(){selFamily=null;selStockList=null;selItem=null;adjMode=null;pg='search';stockListSearchQ='';draw();setTimeout(function(){var x=document.getElementById('search-in');if(x)x.focus()},40)};
  var hsync=document.getElementById('header-sync');
  if(hsync)hsync.onclick=function(){toast('Sincronizando...');sync()};
  var rsync=document.getElementById('rail-sync');
  if(rsync)rsync.onclick=function(){toast('Sincronizando...');sync()};
  var rl=document.getElementById('rail-logout');
  if(rl)rl.onclick=function(){user=null;pg='login';draw()};
}

function currentTopTabIndex(){
  var i=TOP_LEVEL_TABS.indexOf(pg);
  return i<0?0:i;
}
function goPrevTopTab(){
  var i=currentTopTabIndex();
  if(i>0){pg=TOP_LEVEL_TABS[i-1];searchQ='';stockListSearchQ='';draw();}
}
function goNextTopTab(){
  var i=currentTopTabIndex();
  if(i<TOP_LEVEL_TABS.length-1){pg=TOP_LEVEL_TABS[i+1];searchQ='';stockListSearchQ='';draw();}
}
function goBackBySwipe(){
  if(selItem){
    selItem=null;adjMode=null;adjVal='';adjNote='';draw();return;
  }
  if(selFamily&&selStockList){
    selStockList=null;stockListSearchQ='';draw();return;
  }
  if(selFamily){
    selFamily=null;draw();return;
  }
  goPrevTopTab();
}
function goForwardBySwipe(){
  if(selItem||selFamily||selStockList)return;
  goNextTopTab();
}
function findScrollableX(el){
  while(el&&el!==document.body){
    if(el.classList&&el.classList.contains('pill-scroll'))return el;
    var style=window.getComputedStyle(el);
    if((style.overflowX==='auto'||style.overflowX==='scroll')&&el.scrollWidth>el.clientWidth+10)return el;
    el=el.parentElement;
  }
  return null;
}
function shouldIgnoreSwipeTarget(el){
  while(el&&el!==document.body){
    var tag=(el.tagName||'').toUpperCase();
    if(tag==='INPUT'||tag==='TEXTAREA'||tag==='SELECT'||tag==='BUTTON')return true;
    if(el.isContentEditable)return true;
    el=el.parentElement;
  }
  return false;
}
function bindSwipeNavigation(){
  var root=document.getElementById('app');
  if(!root||root.__swipeBound)return;
  root.__swipeBound=true;

  root.addEventListener('touchstart',function(e){
    if(!e.touches||!e.touches.length)return;
    var t=e.touches[0];
    touchStartX=t.clientX;
    touchStartY=t.clientY;
    touchStartTarget=e.target;
    touchStartScrollable=findScrollableX(e.target);
  },{passive:true});

  root.addEventListener('touchend',function(e){
    if(!touchStartTarget||!e.changedTouches||!e.changedTouches.length)return;
    var t=e.changedTouches[0];
    var dx=t.clientX-touchStartX;
    var dy=t.clientY-touchStartY;
    var adx=Math.abs(dx),ady=Math.abs(dy);

    if(adx<70||adx<ady*1.35){touchStartTarget=null;touchStartScrollable=null;return;}
    if(shouldIgnoreSwipeTarget(touchStartTarget)){touchStartTarget=null;touchStartScrollable=null;return;}

    if(touchStartScrollable){
      var sc=touchStartScrollable;
      var canScrollLeft=sc.scrollLeft>2;
      var canScrollRight=sc.scrollLeft+sc.clientWidth<sc.scrollWidth-2;
      if((dx>0&&canScrollLeft)||(dx<0&&canScrollRight)){touchStartTarget=null;touchStartScrollable=null;return;}
    }

    if(dx>0)goBackBySwipe();
    else goForwardBySwipe();

    touchStartTarget=null;
    touchStartScrollable=null;
  },{passive:true});
}

function safeDraw(){
  try{return draw()}catch(e){
    console.error('draw fatal',e);
    var A=document.getElementById('app');
    if(A){
      A.innerHTML='<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:#f9fafb;font-family:Inter,system-ui,sans-serif"><div style="max-width:420px;width:100%;background:#fff;border:1px solid #eaecf0;border-radius:24px;padding:24px;box-shadow:0 12px 24px rgba(16,24,40,.08)"><div style="font-size:20px;font-weight:700;color:#101828">No se pudo abrir la app</div><div style="margin-top:8px;font-size:14px;line-height:1.6;color:#475467">Se detectó un error al renderizar la interfaz.</div><button id="retry-app" style="margin-top:16px;height:44px;padding:0 16px;border:none;border-radius:14px;background:#7f56d9;color:#fff;font:600 14px Inter,system-ui,sans-serif;cursor:pointer">Reintentar</button><div style="margin-top:12px;font-size:12px;color:#98a2b3">'+esc(e&&e.message?e.message:String(e))+'</div></div></div>';
      var r=document.getElementById('retry-app');if(r)r.onclick=function(){safeDraw()}
    }
  }
}

function draw(){
  var A=document.getElementById('app'),html='';
  if(toastMsg)html+='<div style="animation:toastin .24s ease" class="fixed left-1/2 top-5 z-[100] -translate-x-1/2 rounded-full px-4 py-2 text-xs font-semibold text-white shadow-lgsoft '+(toastT==='err'?'bg-error-700':toastT==='warn'?'bg-warning-700':'bg-success-700')+'">'+esc(toastMsg)+'</div>';

  if(!user){
    A.innerHTML=html+renderLogin();
    bindSwipeNavigation();
    var pin=document.getElementById('pin');
    if(pin){
      setTimeout(function(){try{pin.focus();pin.setSelectionRange(pin.value.length,pin.value.length)}catch(e){}},20);
      pin.oninput=function(){loginPin=String(pin.value||'').replace(/\D/g,'').slice(0,4);pin.value=loginPin;if(loginPin.length===4)attemptLogin(loginPin)};
      pin.onkeydown=function(e){if(e.key==='Enter')attemptLogin(loginPin)}
    }
    return;
  }

  if(selItem){
    A.innerHTML=html+renderDetail();
    bindSwipeNavigation();
    bindCommon();
    document.getElementById('back-item').onclick=function(){selItem=null;adjMode=null;adjVal='';adjNote='';draw()};
    document.querySelectorAll('[data-adj]').forEach(function(btn){btn.onclick=function(){adjMode=btn.getAttribute('data-adj');draw();setTimeout(function(){var v=document.getElementById('adj-v');if(v)v.focus()},50)}});
    var adjC=document.getElementById('adj-cancel');if(adjC)adjC.onclick=function(){adjMode=null;adjVal='';adjNote='';draw()};
    var adjV=document.getElementById('adj-v');if(adjV)adjV.oninput=function(){adjVal=adjV.value};
    var adjN=document.getElementById('adj-n');if(adjN)adjN.oninput=function(){adjNote=adjN.value};
    var adjO=document.getElementById('adj-ok');if(adjO)adjO.onclick=function(){var v=parseInt(adjVal);if(isNaN(v)||v<0){toast('Valor inválido','err');return}var old=selItem.stock,ns;if(adjMode==='in')ns=old+v;else if(adjMode==='out')ns=Math.max(0,old-v);else ns=v;items=items.map(function(x){return x.id===selItem.id?Object.assign({},x,{stock:ns}):x});hist.unshift({id:selItem.id,nm:selItem.name,cat:selItem.cat,tp:adjMode==='in'?'ingreso':adjMode==='out'?'salida':'ajuste',os:old,ns:ns,nt:adjNote,u:user.n,ts:ts()});save();pushUpdate(selItem,old,ns,adjMode==='in'?'ingreso':adjMode==='out'?'salida':'ajuste',adjNote);selItem=Object.assign({},selItem,{stock:ns});adjMode=null;adjVal='';adjNote='';toast(selItem.name+': '+old+' → '+ns);draw()};
    return;
  }

  if(selFamily&&!selStockList){
    A.innerHTML=html+renderFamily();
    bindSwipeNavigation();
    bindCommon();
    document.getElementById('back-family').onclick=function(){selFamily=null;draw()};
    return;
  }

  if(selFamily&&selStockList){
    A.innerHTML=html+renderStockListView();
    bindSwipeNavigation();
    bindCommon();
    document.getElementById('back-stocklist').onclick=function(){selStockList=null;stockListSearchQ='';draw()};
    var ssi=document.getElementById('stocklist-search-in');
    if(ssi){
      ssi.oninput=function(){stockListSearchQ=ssi.value;renderStockListResults()};
      setTimeout(renderStockListResults,0);
    }
    document.querySelectorAll('[data-master-cat]').forEach(function(btn){
      btn.onclick=function(){
        var cat=btn.getAttribute('data-master-cat');
        stockListSearchQ=cat;
        var input=document.getElementById('stocklist-search-in');
        if(input)input.value=cat;
        renderStockListResults();
      };
    });
    return;
  }

  if(pg==='home')A.innerHTML=html+renderHome();
  if(pg==='search')A.innerHTML=html+renderSearch();
  if(pg==='alerts')A.innerHTML=html+renderAlerts();
  if(pg==='history')A.innerHTML=html+renderHistory();
  if(pg==='report')A.innerHTML=html+renderReport();

  bindSwipeNavigation();
  bindCommon();

  var si=document.getElementById('search-in');if(si){si.oninput=function(){searchQ=si.value;renderSearchResults()};setTimeout(renderSearchResults,0)}
  var hfq=document.getElementById('hist-filter-q');if(hfq)hfq.oninput=function(){histFilterQuery=hfq.value;renderHistoryTable()};
  var hft=document.getElementById('hist-filter-type');if(hft)hft.onchange=function(){histFilterType=hft.value;renderHistoryTable()};
  document.querySelectorAll('[data-hsort]').forEach(function(btn){btn.onclick=function(){var k=btn.getAttribute('data-hsort');if(histSortKey===k){histSortDir=histSortDir==='asc'?'desc':'asc'}else{histSortKey=k;histSortDir=(k==='delta'?'desc':'asc')}renderHistoryTable()}});
  var db=document.getElementById('open-db');if(db)db.onclick=function(){window.open(SHEET_URL,'_blank')};
  if(pg==='history')setTimeout(renderHistoryTable,0);
}

window.addEventListener('online',function(){authError=false;loadUsers(true);if(user)sync()});
window.addEventListener('offline',function(){authError=true;safeDraw();toast('Sin conexión: usando datos locales','warn')});
loadCachedUsers();
safeDraw();
setTimeout(function(){loadUsers(true).catch(function(){})},0);
