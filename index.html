    function fetchTextWithTimeout(url,opts,timeoutMs){
      timeoutMs=timeoutMs||12000;
      return new Promise(function(resolve,reject){
        var done=false;
        var t=setTimeout(function(){if(done)return;done=true;reject(new Error('Timeout '+timeoutMs+'ms'))},timeoutMs);
        fetch(url,opts||{}).then(function(r){if(done)return;clearTimeout(t);done=true;resolve(r)}).catch(function(err){if(done)return;clearTimeout(t);done=true;reject(err)})
      });
    }
    function fetchJsonWithTimeout(url,opts,timeoutMs){
      return fetchTextWithTimeout(url,opts,timeoutMs).then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);return r.text()}).then(function(txt){try{return JSON.parse(txt)}catch(e){throw new Error('Respuesta no JSON desde Apps Script')}})
    }

    function toast(m,t){toastMsg=m;toastT=t||'ok';draw();clearTimeout(window.__toastTm);window.__toastTm=setTimeout(function(){toastMsg=null;draw()},2200)}

    }

    function loadUsers(force){
      if(authLoading && authPromise) return authPromise;
      if(authLoaded && !force && AUTH_USERS.length) return Promise.resolve(AUTH_USERS);
      if(!isOnline()){
        authLoaded=true;authError=true;
        if(!AUTH_USERS.length){AUTH_USERS=USERS.slice();authSource='demo';authMessage='API_URL sin conexión; usando usuarios locales'}
        else{authSource='cache';authMessage='Sin conexión; usando caché local de usuarios'}
        return Promise.resolve(AUTH_USERS);
      }
      authLoading=true;authMessage='Consultando usuarios en Apps Script...';
      authPromise=fetchJsonWithTimeout(buildApiUrl({action:'getUsers',_ts:Date.now()}),{cache:'no-store'},12000)
        .then(function(d){
          if(d&&d.success&&d.users&&d.users.length){

    function calcProjection(item){
      var pad=function(n){return ('0'+n).slice(-2)};
      if(item.stock<=0) return {title:'Sin stock',subtitle:'No hay unidades disponibles',days:'0',dailyUse:'-',dateOut:'-',color:'#B42318',daysNum:0};
      var moves=hist.filter(function(h){return h.id===item.id});
      var consumptions=[];
      moves.forEach(function(h){if(h.ns<h.os) consumptions.push({amount:h.os-h.ns,ts:h.ts,tp:h.tp})});
      function parseTS(t){
        if(!t)return null;var d=new Date(t);if(!isNaN(d.getTime()))return d;
        var parts=t.split(' ');
        if(parts[0]&&parts[0].indexOf('/')>-1){var dp=parts[0].split('/');var day=parseInt(dp[0]),mon=parseInt(dp[1])-1;var yr=dp[2]?parseInt(dp[2]):new Date().getFullYear();if(yr<100)yr+=2000;var hr=0,mi=0;if(parts[1]&&parts[1].indexOf(':')>-1){var tp=parts[1].split(':');hr=parseInt(tp[0]);mi=parseInt(tp[1])}return new Date(yr,mon,day,hr,mi)}
        return null;
      }
      if(consumptions.length<1){
        if(item.min>0){
          var estDaily=Math.max(1,Math.round(item.min/14));
          var estDays=Math.round(item.stock/estDaily);
          var estDate=new Date();estDate.setDate(estDate.getDate()+estDays);
          var dc=estDays<=7?'#B42318':estDays<=21?'#B54708':estDays<=45?'#175CD3':'#027A48';
          return {title:estDays<=7?'Agotamiento inminente':estDays<=21?'Stock limitado':estDays<=45?'Stock moderado':'Stock holgado',subtitle:'Estimado (aún sin datos de consumo)',days:String(estDays),dailyUse:'~'+estDaily,dateOut:pad(estDate.getDate())+'/'+pad(estDate.getMonth()+1),color:dc,daysNum:estDays};
        }
        return null;
      }
      var totalConsumed=0;consumptions.forEach(function(c){totalConsumed+=c.amount});
      var spanDays=0;var dates=consumptions.map(function(c){return parseTS(c.ts)}).filter(function(d){return d!==null});
      if(dates.length>=2){dates.sort(function(a,b){return a-b});spanDays=Math.max(1,Math.round(Math.abs(dates[dates.length-1]-dates[0])/86400000));}
      else if(dates.length===1){spanDays=Math.max(1,Math.round(Math.abs(new Date()-dates[0])/86400000));}
      else{spanDays=Math.max(1,consumptions.length*3)}
      var dailyUse=totalConsumed/spanDays;if(dailyUse<=0)dailyUse=0.1;
      var daysLeft=Math.round(item.stock/dailyUse);var futureDate=new Date();futureDate.setDate(futureDate.getDate()+daysLeft);
      var dateStr=pad(futureDate.getDate())+'/'+pad(futureDate.getMonth()+1);
      var color=daysLeft<=7?'#B42318':daysLeft<=21?'#B54708':daysLeft<=45?'#175CD3':'#027A48';
      var title=daysLeft<=0?'Sin stock':daysLeft<=7?'Agotamiento inminente':daysLeft<=14?'Pedir pronto':daysLeft<=30?'Stock limitado':daysLeft<=60?'Stock moderado':'Stock holgado';
      var types={};consumptions.forEach(function(c){types[c.tp]=(types[c.tp]||0)+1});
      var desc=[];if(types['salida'])desc.push(types['salida']+' salida'+(types['salida']>1?'s':''));if(types['ajuste'])desc.push(types['ajuste']+' ajuste'+(types['ajuste']>1?'s':''));
      var sub='Basado en '+(desc.length?desc.join(' + '):consumptions.length+' mov.')+' en '+spanDays+' día'+(spanDays>1?'s':'');
      return {title:title,subtitle:sub,days:String(daysLeft),dailyUse:dailyUse<1?dailyUse.toFixed(1):Math.round(dailyUse).toString(),dateOut:dateStr,color:color,daysNum:daysLeft};
    }
