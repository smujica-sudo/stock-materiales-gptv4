<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control Activo Fijo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; overflow-x: hidden; }
        
        .view-section { display: none; }
        
        @keyframes slideInForward { from { opacity: 0; transform: translateX(30px); } to { opacity: 1; transform: translateX(0); } }
        @keyframes slideInBackward { from { opacity: 0; transform: translateX(-30px); } to { opacity: 1; transform: translateX(0); } }
        
        .view-section.active { display: block; animation: slideInForward 0.35s cubic-bezier(0.25, 1, 0.5, 1) forwards; }
        .view-section.active-back { display: block; animation: slideInBackward 0.35s cubic-bezier(0.25, 1, 0.5, 1) forwards; }
        
        .glass-card { background: white; border: 1px solid #e2e8f0; border-radius: 1.25rem; transition: all 0.2s; cursor: pointer; }
        .glass-card:hover { border-color: #6366f1; transform: translateY(-2px); box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1); }
        .glass-card-chart { background: white; border: 1px solid #e2e8f0; border-radius: 1.25rem; transition: all 0.2s; cursor: pointer; }
        .glass-card-chart:hover { border-color: #6366f1; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.05); }
        .glass-card-static { background: white; border: 1px solid #e2e8f0; border-radius: 1.25rem; transition: border-color 0.2s; }
        
        .breadcrumb-item::after { content: '›'; margin: 0 8px; color: #818cf8; font-weight: 400; }
        .breadcrumb-item:last-child::after { content: ''; }
        .breadcrumb-link { cursor: pointer; transition: color 0.2s; }
        .breadcrumb-link:hover { color: white; text-decoration: underline; }

        .table-container { overflow-x: auto; overflow-y: auto; max-height: 70vh; background: white; border: 1px solid #e2e8f0; border-radius: 1rem; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); }
        .data-table { width: 100%; text-align: left; border-collapse: separate; border-spacing: 0; min-width: 1000px; }
        .data-table thead { position: sticky; top: 0; z-index: 20; }
        .data-table th.sortable, .data-table th.nosort { background-color: #f8fafc; padding: 1rem 0.5rem; font-size: 0.65rem; text-transform: uppercase; letter-spacing: 0.05em; color: #64748b; font-weight: 800; border-bottom: 2px solid #e2e8f0; }
        .data-table th.sortable { cursor: pointer; user-select: none; transition: background 0.2s; }
        .data-table th.sortable:hover { background-color: #f1f5f9; color: #4f46e5; }
        .data-table td { padding: 0.75rem 0.5rem; border-bottom: 1px solid #f1f5f9; vertical-align: middle; }
        .data-table tr:last-child td { border-bottom: none; }
        .data-table tr:hover { background-color: #f8fafc; }
        
        .form-input { width: 100%; padding: 0.6rem 0.8rem; border-radius: 0.5rem; border: 1px solid #cbd5e1; font-size: 0.875rem; outline: none; transition: all 0.2s; background-color: #f8fafc; color: #334155; font-weight: 600;}
        .form-input:focus { border-color: #6366f1; background-color: white; box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1); }
        .form-label { display: block; font-size: 0.65rem; font-weight: 800; color: #94a3b8; text-transform: uppercase; margin-bottom: 0.25rem; }
        
        .timeline-item { position: relative; padding-left: 1.5rem; margin-bottom: 1rem; }
        .timeline-item::before { content: ''; position: absolute; left: 0; top: 0.25rem; width: 0.5rem; height: 0.5rem; border-radius: 50%; background-color: #6366f1; }
        .timeline-item::after { content: ''; position: absolute; left: 0.2rem; top: 0.75rem; bottom: -1rem; width: 2px; background-color: #e2e8f0; }
        .timeline-item:last-child::after { display: none; }

        .fab-button { position: fixed; bottom: 2rem; right: 2rem; z-index: 50; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.2); transition: transform 0.2s; }
        .fab-button:hover { transform: scale(1.05); }

        .chart-select { width: 100%; padding: 0.25rem 0.5rem; font-size: 0.6rem; text-transform: uppercase; border: 1px solid #e2e8f0; border-radius: 0.375rem; background: #f8fafc; outline: none; font-weight: 700; color: #64748b; cursor: pointer; transition: all 0.2s; }
        .chart-select:hover { border-color: #cbd5e1; background: white; }
        .chart-select:focus { border-color: #6366f1; color: #4f46e5; }
    </style>
</head>
<body class="text-slate-900 relative">

    <header class="bg-indigo-700 text-white sticky top-0 z-50 shadow-lg">
        <div class="container mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center gap-3 cursor-pointer" onclick="popNav(-1)">
                <i class="fa-solid fa-boxes-stacked text-xl"></i>
                <h1 class="font-extrabold text-lg tracking-tight uppercase hidden lg:block">Control Activo Fijo</h1>
            </div>
            
            <div class="flex items-center gap-2 sm:gap-3">
                <button onclick="forceSync()" class="bg-indigo-800 hover:bg-indigo-900 text-white px-3 py-2 rounded-lg text-xs font-bold transition-colors shadow-inner flex items-center gap-2 border border-indigo-500/50" title="Actualizar datos">
                    <i id="sync-icon" class="fa-solid fa-rotate-right"></i> <span class="hidden sm:inline">SINCRONIZAR</span>
                </button>
                <button onclick="openMasterSearch()" class="bg-indigo-500 hover:bg-indigo-400 text-white px-3 py-2 rounded-lg text-xs font-bold transition-colors shadow-inner flex items-center gap-2">
                    <i class="fa-solid fa-magnifying-glass"></i> <span class="hidden sm:inline">BUSCADOR MAESTRO</span>
                </button>
                <div class="text-[10px] font-bold bg-indigo-800 px-3 py-1 rounded-full border border-indigo-400/30 hidden md:block">
                    <span id="items-count">0</span> ACTIVOS
                </div>
            </div>
        </div>
        <nav class="bg-indigo-900/40 border-t border-indigo-600/50 px-4 py-2">
            <div id="breadcrumb-path" class="container mx-auto flex flex-wrap items-center text-[10px] font-bold uppercase tracking-widest text-indigo-200">
                <span class="breadcrumb-item"><span class="breadcrumb-link" onclick="popNav(-1)">Home</span></span>
            </div>
        </nav>
    </header>

    <button onclick="openAddForm()" class="fab-button bg-emerald-500 hover:bg-emerald-400 text-white font-black py-3 px-6 rounded-full flex items-center gap-2">
        <i class="fa-solid fa-plus text-xl"></i> NUEVO ACTIVO
    </button>

    <div id="loading-overlay" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-[100] hidden flex-col justify-center items-center text-white">
        <i class="fa-solid fa-circle-notch fa-spin text-5xl mb-4 text-indigo-400"></i>
        <h2 class="text-xl font-bold tracking-widest uppercase">Guardando Datos...</h2>
        <p class="text-sm opacity-80">Conectando con base de datos</p>
    </div>

    <main class="container mx-auto px-4 py-6">

        <section id="view-dashboard" class="view-section active">
            <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm mb-6 flex flex-wrap gap-4 items-end">
                <div class="flex-grow min-w-[150px]">
                    <label class="block text-[10px] font-bold text-slate-400 uppercase mb-1">Filtrar Dashboard: Familia</label>
                    <select id="dash-filter-familia" onchange="applyDashboardFilters()" class="w-full p-2 rounded-lg border border-slate-200 text-xs outline-none focus:border-indigo-500 bg-slate-50 font-semibold text-slate-700"></select>
                </div>
                <div class="flex-grow min-w-[150px]">
                    <label class="block text-[10px] font-bold text-slate-400 uppercase mb-1">Categoría</label>
                    <select id="dash-filter-categoria" onchange="applyDashboardFilters()" class="w-full p-2 rounded-lg border border-slate-200 text-xs outline-none focus:border-indigo-500 bg-slate-50 font-semibold text-slate-700"></select>
                </div>
                <div class="flex-grow min-w-[150px]">
                    <label class="block text-[10px] font-bold text-slate-400 uppercase mb-1">Sucursal Responsable</label>
                    <select id="dash-filter-sucursal" onchange="applyDashboardFilters()" class="w-full p-2 rounded-lg border border-slate-200 text-xs outline-none focus:border-indigo-500 bg-slate-50 font-semibold text-slate-700"></select>
                </div>
                <div>
                    <button onclick="resetDashboardFilters()" class="h-[34px] px-4 bg-slate-100 hover:bg-slate-200 text-slate-600 text-xs font-bold rounded-lg transition-colors border border-slate-200" title="Limpiar Filtros"><i class="fa-solid fa-eraser"></i></button>
                </div>
            </div>

            <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-8">
                <div onclick="openMasterSearch()" class="glass-card p-5 border-l-4 border-indigo-600 bg-indigo-50 flex flex-col justify-between">
                    <div class="flex justify-between items-start"><p class="text-[10px] font-black text-indigo-800 uppercase">Activos Totales</p><i class="fa-solid fa-folder-tree text-indigo-400"></i></div>
                    <div class="mt-2"><div id="kpi-total" class="text-3xl font-black text-indigo-900 leading-tight">---</div><div id="kpi-val-total" class="text-sm font-black text-indigo-600 mt-1">---</div></div>
                </div>
                <div onclick="openTableFromKPI('Operación', {Estado: 'Uso Operacion'})" class="glass-card p-5 border-l-4 border-emerald-500 bg-emerald-50 flex flex-col justify-between">
                    <div class="flex justify-between items-start"><p class="text-[10px] font-black text-emerald-800 uppercase">Operación</p><i class="fa-solid fa-circle-check text-emerald-500"></i></div>
                    <div class="mt-2"><div id="kpi-op" class="text-3xl font-black text-emerald-900 leading-tight">---</div><div id="kpi-val-op" class="text-sm font-black text-emerald-600 mt-1">---</div></div>
                </div>
                <div onclick="openTableFromKPI('Mantención', {Estado: 'En Mantencion'})" class="glass-card p-5 border-l-4 border-amber-500 bg-amber-50 flex flex-col justify-between">
                    <div class="flex justify-between items-start"><p class="text-[10px] font-black text-amber-800 uppercase">Mantención</p><i class="fa-solid fa-screwdriver-wrench text-amber-500"></i></div>
                    <div class="mt-2"><div id="kpi-maint" class="text-3xl font-black text-amber-900 leading-tight">---</div><div id="kpi-val-maint" class="text-sm font-black text-amber-600 mt-1">---</div></div>
                </div>
                <div onclick="openTableFromKPI('En Riesgo', {Riesgo: true})" class="glass-card p-5 border-l-4 border-rose-500 bg-rose-50 flex flex-col justify-between">
                    <div class="flex justify-between items-start"><p class="text-[10px] font-black text-rose-800 uppercase">En Riesgo</p><i class="fa-solid fa-triangle-exclamation text-rose-500"></i></div>
                    <div class="mt-2"><div id="kpi-risk" class="text-3xl font-black text-rose-900 leading-tight">---</div><div id="kpi-val-risk" class="text-sm font-black text-rose-600 mt-1">---</div></div>
                </div>
            </div>

            <h2 class="text-xs font-black text-slate-400 uppercase mb-4 tracking-widest border-b border-slate-200 pb-2"><i class="fa-solid fa-chart-pie mr-1"></i> Distribución Operativa</h2>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-10">
                <div class="glass-card-static p-5 flex flex-col group">
                    <div class="flex justify-between items-start mb-3"><h3 class="text-xs font-bold text-slate-500 uppercase flex items-center gap-2"><i class="fa-solid fa-filter text-indigo-300"></i> Estado Operativo</h3></div>
                    <div class="grid grid-cols-2 gap-2 mb-3"><select id="flt-estado-
