    function esc(s){
      return s == null ? "" : String(s)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;");
    }

    function ts(){
      var d = new Date();
      var p = function(n){ return ("0" + n).slice(-2); };
      return p(d.getDate()) + "/" + p(d.getMonth()+1) + " " + p(d.getHours()) + ":" + p(d.getMinutes());
    }

    function parseDateLoose(v){
      if(!v) return 0;
      if(v instanceof Date) return v.getTime();
      var s = String(v).trim();
      var iso = Date.parse(s);
      if(!isNaN(iso)) return iso;
      var m = s.match(/^(\d{2})\/(\d{2})(?:\/(\d{2,4}))?\s+(\d{2}):(\d{2})$/);
      if(m){
        var dd = Number(m[1]);
        var mm = Number(m[2]) - 1;
        var yy = m[3] ? Number(m[3]) : new Date().getFullYear();
        if(yy < 100) yy += 2000;
        var hh = Number(m[4]);
        var mi = Number(m[5]);
        return new Date(yy, mm, dd, hh, mi, 0, 0).getTime();
      }
      return 0;
    }

    function normalizeFamilyName(v){
      var s = String(v || "").trim();
      if(!s) return "Sin familia";
      var plain = s.normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase();

      if(plain === "produccion" || plain === "kawas general") return "Producción";
      if(plain === "mercaderia") return "Mercadería";
      if(plain === "cafe verde") return "Café Verde";
      if(plain === "bebidas frias") return "Bebidas Frías";
      if(plain === "clientes especiales") return "Clientes Especiales";
      return s;
    }

    function st(x){
      if(x.stock === 0) return "zero";
      if(x.stock < x.min * .3) return "crit";
      if(x.stock < x.min) return "low";
      return "ok";
    }

    var STC = {
      zero:{l:"Agotado"},
      crit:{l:"Crítico"},
      low:{l:"Bajo"},
      ok:{l:"OK"}
    };

    function ft(family){
      return FAMILY_THEMES[normalizeFamilyName(family)] || FAMILY_THEMES["Sin familia"];
    }

    function cm(cat){
      return CATEGORY_META[cat] || {icon:"category",color:"#7F56D9"};
    }

    function scm(subcat,cat,name){
      var label = String(subcat || "").trim();
      var categoryMeta = cm(cat);

      if(SUBCATEGORY_META[label]){
        return {icon:SUBCATEGORY_META[label].icon,color:categoryMeta.color};
      }

      var raw = (label || String(name || "") || "").toLowerCase();

      if(/funsmart/.test(raw)) return {icon:"deployed_code",color:categoryMeta.color};
      if(/mtpack|impresa/.test(raw)) return {icon:"inventory_2",color:categoryMeta.color};
      if(/kawas grandes|caja/.test(raw)) return {icon:"inventory",color:categoryMeta.color};
      if(/botellas|botella/.test(raw)) return {icon:"water_bottle",color:categoryMeta.color};
      if(/tapas|tapa/.test(raw)) return {icon:"radio_button_checked",color:categoryMeta.color};
      if(/sello/.test(raw)) return {icon:"approval",color:categoryMeta.color};
      if(/eureka|molino/.test(raw)) return {icon:"tune",color:categoryMeta.color};
      if(/rocket|cafetera|espresso/.test(raw)) return {icon:"espresso",color:categoryMeta.color};
      if(/guatemala|bolivia|regional|huehuetenango|lote/.test(raw)) return {icon:"public",color:categoryMeta.color};

      return {icon:categoryMeta.icon,color:categoryMeta.color};
    }

    function statusTheme(s){

      if(s === "low") return {soft:"bg-warning-50 text-warning-700 border-amber-200",bar:"#F79009",text:"text-warning-700"};
      return {soft:"bg-error-50 text-error-700 border-red-200",bar:"#F04438",text:"text-error-700"};
    }

    function alerts(){
      return items.filter(function(x){ return st(x) !== "ok"; }).sort(function(a,b){
        return ({zero:0,crit:1,low:2,ok:3}[st(a)] - ({zero:0,crit:1,low:2,ok:3}[st(b)]));
      });
    }

    function familyMap(){
      var m = {};
      items.forEach(function(x){
        var f = normalizeFamilyName(x.family || "Sin familia");
        if(!m[f]) m[f] = [];
        m[f].push(x);
      });
      return m;
    }

    function stockListMap(familyName){
      var m = {};
      items
        .filter(function(x){ return normalizeFamilyName(x.family || "Sin familia") === normalizeFamilyName(familyName); })
        .forEach(function(x){
          var sl = x.stockList || "General";
          if(!m[sl]) m[sl] = [];
          m[sl].push(x);
        });
      return m;
    }

    function categoryMapForStockList(familyName,stockListName){
      var m = {};
      items
        .filter(function(x){
          return normalizeFamilyName(x.family || "Sin familia") === normalizeFamilyName(familyName) && (x.stockList || "General") === stockListName;
        })
        .forEach(function(x){
          var c = x.cat || "General";
          if(!m[c]) m[c] = [];
          m[c].push(x);
        });
      return m;
    }

    function enrichItem(x){
      var name = String(x.name || x.nombre || "");
      var cat = String(x.cat || x.categoria || "");
      var familyRaw = x.family || x.familia || (
        /castaño|castano/i.test(name) ? "Clientes Especiales" :
        (cat === "Cold Brew" ? "Bebidas Frías" : "Producción")
      );
      var family = normalizeFamilyName(familyRaw);
      var stockList = x.stockList || x.lista_stock || (
        /castaño|castano/i.test(name) ? "Stock Castaño" :
        (cat === "Cold Brew" ? "Sala Bebidas Frías" : "Stock General Kawas")
      );

      return {
        id: String(x.id || ""),
        family: family,
        stockList: String(stockList || ""),
        cat: cat,
        subcat: String(x.subcat || x.subcategoria || ""),
        name: String(x.name || x.nombre || ""),
        stock: Number(x.stock) || 0,
        min: Number(x.min || x.minimo) || 0,
        unit: String(x.unit || x.unidad || "uds"),
        alert: String(x.alert || x.alerta || "")
      };
    }

      try{
        var d = JSON.parse(localStorage.getItem(STORAGE_KEYS.app));

          items = d.items.map(enrichItem);
          hist = d.hist || [];

          hist = [];

    function loadSession(){
      try{
        var raw = localStorage.getItem(STORAGE_KEYS.session);
        if(!raw) return;

        if(data && data.user){

    function clearLegacyCachesOnce(){
      try{
        if(localStorage.getItem(STORAGE_KEYS.cacheCleared) === "1"){
          return Promise.resolve();
        }
      }catch(e){}

      var swPromise = ("serviceWorker" in navigator)
        ? navigator.serviceWorker.getRegistrations().then(function(regs){
            return Promise.all(regs.map(function(reg){ return reg.unregister(); }));
          }).catch(function(){})
        : Promise.resolve();

      var cachePromise = ("caches" in window)
        ? caches.keys().then(function(keys){
            return Promise.all(keys.map(function(key){ return caches.delete(key); }));
          }).catch(function(){})
        : Promise.resolve();

      return Promise.all([swPromise, cachePromise]).then(function(){
        try{ localStorage.setItem(STORAGE_KEYS.cacheCleared, "1"); }catch(e){}
      });
    }

    function isOnline(){
      return navigator.onLine && API_URL !== "" && API_URL !== "DEMO" && API_URL !== "TU_URL_AQUI";

    function normalizeUsers(arr){
      return (arr || [])
        .map(function(u){
          return {
            n: String(u.nombre || u.n || "Usuario").trim(),

          };
        })
        .filter(function(u){ return u.n && u.p; });
    }

    function loadCachedUsers(){
      try{
        var raw = localStorage.getItem(STORAGE_KEYS.authUsers);
        if(!raw) return [];
        var parsed = JSON.parse(raw);
        var users = normalizeUsers(parsed);
        if(users.length) AUTH_USERS = users;
        return users;
      }catch(e){
        return [];
      }
    }

    function saveCachedUsers(users){
      try{ localStorage.setItem(STORAGE_KEYS.authUsers, JSON.stringify(users || [])); }catch(e){}
    }

    function buildApiUrl(params){
      var q = Object.keys(params || {})
        .map(function(k){ return encodeURIComponent(k) + "=" + encodeURIComponent(params[k]); })
        .join("&");
      return API_URL + (API_URL.indexOf("?") > -1 ? "&" : "?") + q;
    }

    function fetchTextWithTimeout(url,opts,timeoutMs){
      timeoutMs = timeoutMs || 12000;
      return new Promise(function(resolve,reject){
        var done = false;
        var t = setTimeout(function(){
          if(done) return;
          done = true;
          reject(new Error("Timeout " + timeoutMs + "ms"));
        }, timeoutMs);

        fetch(url, opts || {})
          .then(function(r){
            if(done) return;
            clearTimeout(t);
            done = true;
            resolve(r);
          })
          .catch(function(err){
            if(done) return;
            clearTimeout(t);
            done = true;
            reject(err);
          });
      });
    }

    function fetchJsonWithTimeout(url,opts,timeoutMs){
      return fetchTextWithTimeout(url,opts,timeoutMs)
        .then(function(r){
          return r.text().then(function(txt){
            var body = String(txt || "").trim();
            if(!r.ok){
              throw new Error("HTTP " + r.status + (body ? " · " + body.slice(0,140) : ""));
            }
            try{
              return JSON.parse(body);
            }catch(e){
              throw new Error("Respuesta no JSON" + (body ? " · " + body.slice(0,140) : ""));
            }
          });
        });
    }

    function setSyncError(msg){ lastSyncError = String(msg || ""); }
    function clearSyncError(){ lastSyncError = ""; }

    function toast(m,t){
      toastMsg = m;
      toastT = t || "ok";
      safeDraw();
      clearTimeout(window.__toastTm);
      window.__toastTm = setTimeout(function(){
        toastMsg = null;
        safeDraw();
      }, 2600);
    }

    function setSyncState(state,tsLabel){
      syncState = state;
      if(tsLabel) lastSyncAt = tsLabel;
      safeDraw();
    }

    function getSyncMeta(){
      if(!isOnline()) return {label:"Offline",dot:"#F79009",text:"text-warning-700"};
      if(syncState === "syncing") return {label:"Sincronizando",dot:"#175CD3",text:"text-blue-700"};
      if(syncState === "error") return {label:"Error sync",dot:"#F04438",text:"text-error-700"};
      if(syncState === "success") return {label:lastSyncAt ? ("Sync " + lastSyncAt) : "Sincronizado",dot:"#12B76A",text:"text-success-700"};
      return {label:"Listo",dot:"#98A2B3",text:"text-gray-500"};
    }

    function loadUsers(force){
      if(authLoading && authPromise) return authPromise;
      if(authLoaded && !force && AUTH_USERS.length) return Promise.resolve(AUTH_USERS);

      if(!isOnline()){
        authLoaded = true;
        authError = true;
        AUTH_USERS = AUTH_USERS.length ? AUTH_USERS : USERS.slice();
        return Promise.resolve(AUTH_USERS);
      }

      authLoading = true;
      authPromise = fetchJsonWithTimeout(buildApiUrl({action:"getUsers",_ts:Date.now()}), {cache:"no-store"}, 12000)
        .then(function(d){
          if(d && d.success && d.users && d.users.length){
            AUTH_USERS = normalizeUsers(d.users);
            saveCachedUsers(AUTH_USERS);
            authError = false;
          }else{
            throw new Error("getUsers no devolvió usuarios");
          }
          authLoaded = true;
          authLoading = false;
          authPromise = null;
          return AUTH_USERS;
        })
        .catch(function(err){
          authLoaded = true;
          authLoading = false;
          authError = true;
          authPromise = null;
          AUTH_USERS = AUTH_USERS.length ? AUTH_USERS : USERS.slice();
          setSyncError("Auth: " + (err && err.message ? err.message : String(err)));
          return AUTH_USERS;
        });

      return authPromise;
    }

    function validatePinAttempt(pinAttempt){
      var seen = {};
      var pool = [];
      (AUTH_USERS || []).concat(USERS || []).forEach(function(x){
        if(!x || x.p == null) return;
        var k = String(x.p);
        if(seen[k]) return;
        seen[k] = true;
        pool.push(x);
      });

      var u = pool.find(function(x){ return String(x.p) === String(pinAttempt); });
      return u ? {ok:true,user:u} : {ok:false};
    }

    function completeLogin(u){
      loginBusy = false;
      loginPin = "";
      user = u;
      loadAppState();
      loadPendingUpdates();
      pg = "home";
      saveSession();
      safeDraw();
      sync(true);
      toast("Hola, " + u.n);
    }

    function attemptLogin(pinAttempt){
      if(loginBusy) return;
      var attempt = String(pinAttempt || loginPin || "").replace(/\D/g,"").slice(0,4);
      if(attempt.length !== 4) return;

      loginBusy = true;
      var firstTry = validatePinAttempt(attempt);
      if(firstTry.ok){
        completeLogin(firstTry.user);
        return;
      }

      loadUsers(true)
        .then(function(){
          var secondTry = validatePinAttempt(attempt);
          if(secondTry.ok){
            completeLogin(secondTry.user);
          }else{
            loginBusy = false;
            loginPin = "";
            draw();
            toast("PIN incorrecto","err");
          }
        })
        .catch(function(){
          loginBusy = false;
          loginPin = "";
          draw();
          toast("No se pudo validar el PIN","err");
        });
    }

    function queuePendingUpdate(payload){
      pendingUpdates.push({
        itemId: payload.itemId,
        newStock: payload.newStock,
        oldStock: payload.oldStock,
        tipo: payload.tipo,
        usuario: payload.usuario,
        nota: payload.nota || "",
        createdAt: new Date().toISOString()
      });
      savePendingUpdates();
    }

    function flushPendingUpdates(silent){
      if(!isOnline() || !pendingUpdates.length){
        return Promise.resolve({flushed:0});
      }

      var queue = pendingUpdates.slice();
      var flushed = 0;

      return queue.reduce(function(p,entry){
        return p.then(function(){
          var body = JSON.stringify({
            action:"updateStock",
            itemId:entry.itemId,
            newStock:entry.newStock,
            oldStock:entry.oldStock,
            tipo:entry.tipo,
            usuario:entry.usuario,
            nota:entry.nota || ""
          });
          return fetchJsonWithTimeout(API_URL, {
            method:"POST",
            body:body,
            headers:{"Content-Type":"text/plain;charset=utf-8"}
          }, 15000).then(function(d){
            if(d && d.success){
              flushed++;
              pendingUpdates.shift();
              savePendingUpdates();
              clearSyncError();
            } else {
              throw new Error("updateStock respondió sin success");
            }
          }).catch(function(err){
            setSyncError("Pendiente: " + (err && err.message ? err.message : String(err)));
            return Promise.resolve();
          });
        });
      }, Promise.resolve()).then(function(){
        if(flushed && !silent) toast(flushed + " cambio(s) pendiente(s) sincronizado(s)");
        return {flushed:flushed};
      });
    }

    function sync(silent){
      if(!isOnline()){
        saveAppState();
        setSyncState("offline");
        setSyncError("Sin conexión");
        return Promise.resolve(false);
      }

      setSyncState("syncing");
      var syncId = ++syncCounter;

      return flushPendingUpdates(true)
        .then(function(){
          var stockReq = fetchJsonWithTimeout(
            buildApiUrl({action:"getAll",_ts:Date.now()}),
            {cache:"no-store"},
            15000
          ).then(function(d){
            if(!(d && d.success && d.items)) throw new Error("getAll inválido");
            return d.items.map(enrichItem);
          });

          var histReq = fetchJsonWithTimeout(
            buildApiUrl({action:"getHistory",limit:100,_ts:Date.now()}),
            {cache:"no-store"},
            15000
          ).then(function(d){
            if(!(d && d.success && d.entries)) throw new Error("getHistory inválido");
            return d.entries.map(function(x){
              return {
                id:String(x.itemId || x.item_id || x.id || ""),
                nm:String(x.itemNombre || x.item_nombre || x.nm || ""),
                cat:String(x.categoria || x.cat || ""),
                tp:String(x.tipo || x.tp || ""),
                os:Number(x.stockAnterior != null ? x.stockAnterior : (x.stock_anterior != null ? x.stock_anterior : x.os)) || 0,
                ns:Number(x.stockNuevo != null ? x.stockNuevo : (x.stock_nuevo != null ? x.stock_nuevo : x.ns)) || 0,
                nt:String(x.nota || x.nt || ""),
                u:String(x.usuario || x.u || "?"),
                ts:x.timestamp ? String(x.timestamp).substring(0,16).replace("T"," ") : (x.ts || "")
              };
            });
          });

          return Promise.allSettled([stockReq,histReq]).then(function(results){
            if(syncId !== syncCounter) return false;

            var stockOk = results[0].status === "fulfilled";
            var histOk = results[1].status === "fulfilled";

            if(stockOk) items = results[0].value;
            if(histOk) hist = results[1].value;

            if(stockOk || histOk){
              saveAppState();
              saveSession();
              clearSyncError();
              setSyncState("success", new Date().toLocaleTimeString("es-CL",{hour:"2-digit",minute:"2-digit",hour12:false}));
              safeDraw();
              if(!silent) toast("Sincronización completada");
            }

            if(!stockOk && !histOk){
              var msg0 = results[0].reason && results[0].reason.message ? results[0].reason.message : "getAll error";
              var msg1 = results[1].reason && results[1].reason.message ? results[1].reason.message : "getHistory error";
              setSyncError("getAll: " + msg0 + " | getHistory: " + msg1);
              setSyncState("error");
              if(!silent) toast("No se pudo sincronizar","err");
            }else if(!stockOk || !histOk){
              var partialErr = !stockOk
                ? ("getAll: " + (results[0].reason && results[0].reason.message ? results[0].reason.message : "error"))
                : ("getHistory: " + (results[1].reason && results[1].reason.message ? results[1].reason.message : "error"));
              setSyncError(partialErr);
              setSyncState("success", new Date().toLocaleTimeString("es-CL",{hour:"2-digit",minute:"2-digit",hour12:false}));
              if(!silent) toast("Sincronización parcial","warn");
            }

            return stockOk || histOk;
          });
        })
        .catch(function(err){
          setSyncError(err && err.message ? err.message : String(err));
          setSyncState("error");
          if(!silent) toast("No se pudo sincronizar","err");
          return false;
        });
    }

    function pushUpdate(item,oldStock,newStock,type,note){
      var payload = {
        itemId:item.id,
        newStock:newStock,
        oldStock:oldStock,
        tipo:type,
        usuario:user ? user.n : "?",
        nota:note || ""
      };

      if(!isOnline()){
        queuePendingUpdate(payload);
        saveAppState();
        setSyncState("offline");
        setSyncError("Sin conexión");
        toast("Sin conexión: cambio guardado localmente","warn");
        return Promise.resolve(false);
      }

      var body = JSON.stringify({
        action:"updateStock",
        itemId:item.id,
        newStock:newStock,
        oldStock:oldStock,
        tipo:type,
        usuario:user ? user.n : "?",
        nota:note || ""
      });

      return fetchJsonWithTimeout(API_URL,{
        method:"POST",
        body:body,
        headers:{"Content-Type":"text/plain;charset=utf-8"}
      },15000)
      .then(function(d){
        if(d && d.success){
          clearSyncError();
          setSyncState("success", new Date().toLocaleTimeString("es-CL",{hour:"2-digit",minute:"2-digit",hour12:false}));
          toast("Guardado en Sheets");
          return true;
        }
        throw new Error("updateStock respondió sin success");
      })
      .catch(function(err){
        queuePendingUpdate(payload);
        setSyncError(err && err.message ? err.message : String(err));
        setSyncState("error");
        toast("No se pudo enviar. Cambio en cola local","warn");
        return false;
      });
    }

    }


    function reportStatusRank(status){
      return ({zero:0,crit:1,low:2,ok:3}[status] != null) ? ({zero:0,crit:1,low:2,ok:3}[status]) : 4;
    }

    function reportCoverage(item){
      if(!item) return 0;
      if(Number(item.min) <= 0){
        return Number(item.stock) > 0 ? 100 : 0;
      }
      return Math.round((Number(item.stock) || 0) / Number(item.min) * 100);
    }

    function reportPercent(part,total){
      if(!total) return 0;
      return Math.round((part / total) * 100);
    }

    function reportSeverityLabel(status){
      if(status === "zero") return "Agotado";
      if(status === "crit") return "Crítico";
      if(status === "low") return "Bajo";
      return "OK";
    }

    function getReportFamilyOptions(){
      return Object.keys(familyMap()).sort(function(a,b){ return a.localeCompare(b); });
    }

    function getReportStockListOptions(){
      var lists = {};
      items.forEach(function(x){
        var family = normalizeFamilyName(x.family || "Sin familia");
        var listName = x.stockList || "General";
        if(reportFilterFamily !== "all" && family !== reportFilterFamily) return;
        lists[listName] = true;
      });
      return Object.keys(lists).sort(function(a,b){ return a.localeCompare(b); });
    }

    function getReportCategoryOptions(){
      var categories = {};
      items.forEach(function(x){
        var family = normalizeFamilyName(x.family || "Sin familia");
        var listName = x.stockList || "General";
        if(reportFilterFamily !== "all" && family !== reportFilterFamily) return;
        if(reportFilterStockList !== "all" && listName !== reportFilterStockList) return;
        categories[x.cat || "General"] = true;
      });
      return Object.keys(categories).sort(function(a,b){ return a.localeCompare(b); });
    }

    function getFilteredReportItems(){
      function reportSearchText(item){
        return String([
          item.id,
          item.name,
          item.family,
          item.stockList,
          item.cat,
          item.subcat,
          item.unit,
          item.alert
        ].join(" ")).toLowerCase();
      }

      var query = String(reportSearchQ || "").trim().toLowerCase();

      var filtered = items.filter(function(item){
        var family = normalizeFamilyName(item.family || "Sin familia");
        var listName = item.stockList || "General";
        var category = item.cat || "General";
        var status = st(item);

        if(reportFilterFamily !== "all" && family !== reportFilterFamily) return false;
        if(reportFilterStockList !== "all" && listName !== reportFilterStockList) return false;
        if(reportFilterCategory !== "all" && category !== reportFilterCategory) return false;

        if(reportFilterStatus !== "all"){
          if(reportFilterStatus === "alert" && status === "ok") return false;
          if(reportFilterStatus !== "alert" && status !== reportFilterStatus) return false;
        }

        if(query && reportSearchText(item).indexOf(query) === -1) return false;
        return true;
      });

      filtered.sort(function(a,b){
        var av, bv;
        if(reportSortKey === "name_asc"){
          av = String(a.name || "").toLowerCase();
          bv = String(b.name || "").toLowerCase();
          return av.localeCompare(bv);
        }
        if(reportSortKey === "name_desc"){
          av = String(a.name || "").toLowerCase();
          bv = String(b.name || "").toLowerCase();
          return bv.localeCompare(av);
        }
        if(reportSortKey === "stock_asc"){
          return (Number(a.stock) || 0) - (Number(b.stock) || 0);
        }
        if(reportSortKey === "stock_desc"){
          return (Number(b.stock) || 0) - (Number(a.stock) || 0);
        }
        if(reportSortKey === "coverage_asc"){
          return reportCoverage(a) - reportCoverage(b);
        }
        if(reportSortKey === "coverage_desc"){
          return reportCoverage(b) - reportCoverage(a);
        }

        var sa = reportStatusRank(st(a));
        var sb = reportStatusRank(st(b));
        if(sa !== sb) return sa - sb;
        if(reportCoverage(a) !== reportCoverage(b)) return reportCoverage(a) - reportCoverage(b);
        if((Number(a.stock) || 0) !== (Number(b.stock) || 0)) return (Number(a.stock) || 0) - (Number(b.stock) || 0);
        return String(a.name || "").localeCompare(String(b.name || ""));
      });

      return filtered;
    }

    function getReportMovementsForItems(filteredItems, daysWindow, limit){
      var ids = {};
      filteredItems.forEach(function(item){ ids[item.id] = true; });

      var since = 0;
      if(daysWindow){
        since = Date.now() - (daysWindow * 24 * 60 * 60 * 1000);
      }

      var entries = hist
        .filter(function(entry){
          if(!ids[entry.id]) return false;
          if(!since) return true;
          return parseDateLoose(entry.ts) >= since;
        })
        .map(function(entry){
          var delta = (Number(entry.ns) || 0) - (Number(entry.os) || 0);
          return Object.assign({delta:delta}, entry);
        })
        .sort(function(a,b){ return parseDateLoose(b.ts) - parseDateLoose(a.ts); });

      return typeof limit === "number" ? entries.slice(0, limit) : entries;
    }

    function getReportData(){
      var filtered = getFilteredReportItems();
      var stockTotal = 0;
      var statusCounts = {ok:0,low:0,crit:0,zero:0};
      var categoryAgg = {};
      var familyAgg = {};
      var stockListAgg = {};
      var coverageSum = 0;
      var underMinCount = 0;

      filtered.forEach(function(item){
        var status = st(item);
        var family = normalizeFamilyName(item.family || "Sin familia");
        var listName = item.stockList || "General";
        var category = item.cat || "General";
        var stock = Number(item.stock) || 0;
        var min = Number(item.min) || 0;
        var coverage = reportCoverage(item);

        stockTotal += stock;
        statusCounts[status] = (statusCounts[status] || 0) + 1;
        coverageSum += coverage;
        if(min > 0 && stock < min) underMinCount++;

        if(!categoryAgg[category]){
          categoryAgg[category] = {label:category, stock:0, items:0, alerts:0, lowOrCritical:0, zero:0};
        }
        categoryAgg[category].stock += stock;
        categoryAgg[category].items += 1;
        if(status !== "ok") categoryAgg[category].alerts += 1;
        if(status === "low" || status === "crit") categoryAgg[category].lowOrCritical += 1;
        if(status === "zero") categoryAgg[category].zero += 1;

        if(!familyAgg[family]){
          familyAgg[family] = {label:family, stock:0, items:0, alerts:0};
        }
        familyAgg[family].stock += stock;
        familyAgg[family].items += 1;
        if(status !== "ok") familyAgg[family].alerts += 1;

        if(!stockListAgg[listName]){
          stockListAgg[listName] = {label:listName, stock:0, items:0, alerts:0};
        }
        stockListAgg[listName].stock += stock;
        stockListAgg[listName].items += 1;
        if(status !== "ok") stockListAgg[listName].alerts += 1;
      });

      var categorySummary = Object.keys(categoryAgg).map(function(key){ return categoryAgg[key]; }).sort(function(a,b){
        if(b.stock !== a.stock) return b.stock - a.stock;
        return a.label.localeCompare(b.label);
      });

      var familySummary = Object.keys(familyAgg).map(function(key){ return familyAgg[key]; }).sort(function(a,b){
        if(b.stock !== a.stock) return b.stock - a.stock;
        return a.label.localeCompare(b.label);
      });

      var stockListSummary = Object.keys(stockListAgg).map(function(key){ return stockListAgg[key]; }).sort(function(a,b){
        if(b.stock !== a.stock) return b.stock - a.stock;
        return a.label.localeCompare(b.label);
      });

      var recentMovements = getReportMovementsForItems(filtered, 30, 12);
      var movementWindow = getReportMovementsForItems(filtered, 30);
      var movementMetrics = {
        ingreso: movementWindow.filter(function(x){ return x.tp === "ingreso"; }).length,
        salida: movementWindow.filter(function(x){ return x.tp === "salida"; }).length,
        ajuste: movementWindow.filter(function(x){ return x.tp === "ajuste"; }).length
      };

      var alertCount = statusCounts.low + statusCounts.crit + statusCounts.zero;
      var avgCoverage = filtered.length ? Math.round(coverageSum / filtered.length) : 0;
      var topCategory = categorySummary[0] || null;
      var topFamily = familySummary[0] || null;
      var topStockList = stockListSummary[0] || null;
      var topThreeCategoryShare = 0;
      categorySummary.slice(0,3).forEach(function(entry){ topThreeCategoryShare += entry.stock; });

      var insights = [];
      if(!filtered.length){
        insights.push("No hay datos en el reporte con los filtros actuales.");
      }else{
        insights.push(alertCount ? (alertCount + " de " + filtered.length + " ítems filtrados requieren atención.") : "Todos los ítems filtrados están sobre el mínimo configurado.");
        insights.push("Cobertura promedio del stock filtrado: " + avgCoverage + "% del mínimo configurado.");
        if(topCategory){
          insights.push("La categoría con mayor concentración es " + topCategory.label + " con " + topCategory.stock.toLocaleString() + " unidades.");
        }
        if(stockTotal > 0 && categorySummary.length){
          insights.push("Las 3 categorías principales concentran " + reportPercent(topThreeCategoryShare, stockTotal) + "% del stock filtrado.");
        }
        if(recentMovements.length){
          insights.push("Se registraron " + movementWindow.length + " movimientos en 30 días para este subconjunto.");
        }
      }

      return {
        filtered: filtered,
        stockTotal: stockTotal,
        statusCounts: statusCounts,
        alertCount: alertCount,
        avgCoverage: avgCoverage,
        underMinCount: underMinCount,
        categorySummary: categorySummary,
        familySummary: familySummary,
        stockListSummary: stockListSummary,
        topCategory: topCategory,
        topFamily: topFamily,
        topStockList: topStockList,
        recentMovements: recentMovements,
        movementMetrics: movementMetrics,
        insights: insights,
        topShortages: filtered.slice().sort(function(a,b){
          var sa = reportStatusRank(st(a));
          var sb = reportStatusRank(st(b));
          if(sa !== sb) return sa - sb;
          if(reportCoverage(a) !== reportCoverage(b)) return reportCoverage(a) - reportCoverage(b);
          return (Number(a.stock) || 0) - (Number(b.stock) || 0);
        }).filter(function(item){ return st(item) !== "ok"; }).slice(0, 8),
        filterSummary: [
          reportFilterFamily !== "all" ? ("Familia: " + reportFilterFamily) : "Familia: Todas",
          reportFilterStockList !== "all" ? ("Lista: " + reportFilterStockList) : "Lista: Todas",
          reportFilterCategory !== "all" ? ("Categoría: " + reportFilterCategory) : "Categoría: Todas",
          reportFilterStatus !== "all" ? ("Estado: " + (reportFilterStatus === "alert" ? "Con alertas" : reportSeverityLabel(reportFilterStatus))) : "Estado: Todos",
          reportSearchQ ? ("Búsqueda: " + reportSearchQ) : "Búsqueda: General"
        ]
      };
    }

    function renderReportMiniBars(entries, total, accentColor, emptyLabel){
      if(!entries.length){
        return '<div class="rounded-[24px] border border-dashed border-gray-300 bg-gray-50 px-4 py-8 text-center text-sm text-gray-500">'+esc(emptyLabel || "Sin datos")+'</div>';

      var top = entries.slice(0, 6);

      }).join('')+'</div>';
    }

    function reportDrawPdfMetric(doc, x, y, w, h, label, value, tone){

      doc.setDrawColor(234,236,240);
      doc.roundedRect(x, y, w, h, 5, 5, "FD");
      doc.setFontSize(9);
      doc.setTextColor(102,112,133);
      doc.text(String(label || ""), x + 4, y + 7);
      doc.setFontSize(18);
      doc.setTextColor.apply(doc, tone || [16,24,40]);
      doc.text(String(value || ""), x + 4, y + 17);
    }

    function reportDrawPdfBars(doc, startX, startY, width, entries, total, color){
      var y = startY;
      entries.slice(0,5).forEach(function(entry){
        var value = Number(entry.value != null ? entry.value : entry.stock) || 0;
        var pct = total ? (value / total) : 0;
        doc.setFontSize(9);
        doc.setTextColor(52,64,84);
        doc.text(String(entry.label || ""), startX, y);
        doc.text(String(value), startX + width, y, {align:"right"});
        doc.setFillColor(242,244,247);
        doc.roundedRect(startX, y + 2, width, 4, 2, 2, "F");
        var barWidth = value > 0 ? Math.max(4, Math.round(width * pct)) : 0;
        doc.setFillColor.apply(doc, entry.rgb || color || [127,86,217]);
        doc.roundedRect(startX, y + 2, Math.min(width, barWidth), 4, 2, 2, "F");
        y += 12;
      });
      return y;
    }

    function getSearchMatches(raw){
      function norm(v){
        return String(v || "")
          .toLowerCase()
          .normalize("NFD")
          .replace(/[\u0300-\u036f]/g,"")
          .trim();
      }

      var q = norm(raw);
      var terms = q.split(/\s+/).filter(Boolean);
      if(!q) return [];

      function searchableText(i){
        return norm([i.name,i.family,i.stockList,i.cat,i.subcat,i.unit,i.alert,i.id].join(" "));
      }

      function scoreItem(i){
        var name = norm(i.name);
        var family = norm(i.family);
        var stockList = norm(i.stockList);
        var cat = norm(i.cat);
        var subcat = norm(i.subcat);
        var alert = norm(i.alert);
        var all = searchableText(i);
        var score = 0;

        if(name === q) score += 120;
        if(stockList === q) score += 110;
        if(cat === q) score += 100;
        if(subcat === q) score += 100;
        if(family === q) score += 95;
        if(name.indexOf(q) === 0) score += 80;
        if(stockList.indexOf(q) === 0) score += 70;
        if(cat.indexOf(q) === 0) score += 65;
        if(subcat.indexOf(q) === 0) score += 65;
        if(family.indexOf(q) === 0) score += 60;
        if(name.indexOf(q) !== -1) score += 50;
        if(stockList.indexOf(q) !== -1) score += 45;
        if(cat.indexOf(q) !== -1) score += 40;
        if(subcat.indexOf(q) !== -1) score += 40;
        if(family.indexOf(q) !== -1) score += 35;
        if(alert.indexOf(q) !== -1) score += 20;
        if(all.indexOf(q) !== -1) score += 10;

        var matchedTerms = 0;
        terms.forEach(function(t){
          if(all.indexOf(t) !== -1){
            matchedTerms++;
            score += 8;
          }
          if(name.indexOf(t) !== -1) score += 4;
          if(stockList.indexOf(t) !== -1) score += 3;
          if(cat.indexOf(t) !== -1) score += 3;
          if(subcat.indexOf(t) !== -1) score += 3;
          if(family.indexOf(t) !== -1) score += 2;
        });

        return {score:score,matchedTerms:matchedTerms};
      }

      return items
        .map(function(i){
          var meta = scoreItem(i);
          return {item:i,score:meta.score,matchedTerms:meta.matchedTerms};
        })
        .filter(function(x){ return x.score > 0 && x.matchedTerms === terms.length; })
        .sort(function(a,b){
          var order = {zero:0,crit:1,low:2,ok:3};
          var sa = order[st(a.item)];
          var sb = order[st(b.item)];
          if(sa !== sb) return sa - sb;
          if(b.score !== a.score) return b.score - a.score;
          if(a.item.stock !== b.item.stock) return a.item.stock - b.item.stock;
          return a.item.name > b.item.name ? 1 : -1;
        })
        .map(function(x){ return x.item; });
    }

    function getStockListMatches(familyName,stockListName,raw){
      function norm(v){
        return String(v || "")
          .toLowerCase()
          .normalize("NFD")
          .replace(/[\u0300-\u036f]/g,"")
          .trim();
      }

      var q = norm(raw || "");
      var terms = q.split(/\s+/).filter(Boolean);
      var base = items.filter(function(x){
        return normalizeFamilyName(x.family || "Sin familia") === normalizeFamilyName(familyName) && (x.stockList || "General") === stockListName;
      });

      if(!q){
        return base.slice().sort(function(a,b){
          var order = {zero:0,crit:1,low:2,ok:3};
          var sa = order[st(a)];
          var sb = order[st(b)];
          if(sa !== sb) return sa - sb;
          if(a.stock !== b.stock) return a.stock - b.stock;
          return (a.name || "").localeCompare(b.name || "");
        });
      }

      function searchableText(i){
        return norm([i.name,i.cat,i.subcat,i.unit,i.alert,i.id].join(" "));
      }

      function scoreItem(i){
        var name = norm(i.name);
        var cat = norm(i.cat);
        var subcat = norm(i.subcat);
        var alert = norm(i.alert);
        var all = searchableText(i);
        var score = 0;

        if(name === q) score += 120;
        if(cat === q) score += 105;
        if(subcat === q) score += 100;
        if(name.indexOf(q) === 0) score += 80;
        if(cat.indexOf(q) === 0) score += 70;
        if(subcat.indexOf(q) === 0) score += 70;
        if(name.indexOf(q) !== -1) score += 50;
        if(cat.indexOf(q) !== -1) score += 40;
        if(subcat.indexOf(q) !== -1) score += 40;
        if(alert.indexOf(q) !== -1) score += 20;
        if(all.indexOf(q) !== -1) score += 10;

        var matchedTerms = 0;
        terms.forEach(function(t){
          if(all.indexOf(t) !== -1){
            matchedTerms++;
            score += 8;
          }
          if(name.indexOf(t) !== -1) score += 4;
          if(cat.indexOf(t) !== -1) score += 3;
          if(subcat.indexOf(t) !== -1) score += 3;
        });

        return {score:score,matchedTerms:matchedTerms};
      }

      return base
        .map(function(i){
          var meta = scoreItem(i);
          return {item:i,score:meta.score,matchedTerms:meta.matchedTerms};
        })
        .filter(function(x){ return x.score > 0 && x.matchedTerms === terms.length; })
        .sort(function(a,b){
          var order = {zero:0,crit:1,low:2,ok:3};
          var sa = order[st(a.item)];
          var sb = order[st(b.item)];
          if(sa !== sb) return sa - sb;
          if(b.score !== a.score) return b.score - a.score;
          if(a.item.stock !== b.item.stock) return a.item.stock - b.item.stock;
          return (a.item.name || "").localeCompare(b.item.name || "");
        })
        .map(function(x){ return x.item; });
    }

    function renderHistoryTable(){
      var body = document.getElementById("history-table-body");

      if(histFilterType !== "all"){
        rows = rows.filter(function(r){ return r.tp === histFilterType; });
      }

      var q = (histFilterQuery || "").trim().toLowerCase();
      if(q){
        rows = rows.filter(function(r){
          return [r.nm,r.cat,r.tp,r.u,r.nt,r.ts].join(" ").toLowerCase().indexOf(q) !== -1;
        });
      }

      rows = rows.map(function(r){
        var delta = (Number(r.ns) || 0) - (Number(r.os) || 0);
        return Object.assign({delta:delta}, r);
      });

      rows.sort(function(a,b){
        var av, bv;
        if(histSortKey === "delta"){
          av = a.delta;
          bv = b.delta;
        }else if(histSortKey === "ts"){
          av = parseDateLoose(a.ts);
          bv = parseDateLoose(b.ts);
        }else{
          av = String(a[histSortKey] || "").toLowerCase();
          bv = String(b[histSortKey] || "").toLowerCase();
        }
        if(av < bv) return histSortDir === "asc" ? -1 : 1;

        return 0;
      });

    function findScrollableX(el){
      while(el && el !== document.body){
        if(el.classList && el.classList.contains("pill-scroll")) return el;
        var style = window.getComputedStyle(el);
        if((style.overflowX === "auto" || style.overflowX === "scroll") && el.scrollWidth > el.clientWidth + 10){
          return el;
        }
        el = el.parentElement;
      }
      return null;
    }

    function shouldIgnoreSwipeTarget(el){
      while(el && el !== document.body){
        var tag = (el.tagName || "").toUpperCase();
        if(tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT" || tag === "BUTTON") return true;
        if(el.isContentEditable) return true;
        el = el.parentElement;
      }
      return false;
    }

    function bindSwipeNavigation(){
      var root = document.getElementById("app");
      if(!root || root.__swipeBound) return;
      root.__swipeBound = true;

      root.addEventListener("touchstart", function(e){
        if(!e.touches || !e.touches.length) return;
        var t = e.touches[0];
        touchStartX = t.clientX;
        touchStartY = t.clientY;
        touchStartTarget = e.target;
        touchStartScrollable = findScrollableX(e.target);
      }, {passive:true});

      root.addEventListener("touchend", function(e){
        if(!touchStartTarget || !e.changedTouches || !e.changedTouches.length) return;
        var t = e.changedTouches[0];
        var dx = t.clientX - touchStartX;
        var dy = t.clientY - touchStartY;
        var adx = Math.abs(dx);
        var ady = Math.abs(dy);

        if(adx < 70 || adx < ady * 1.35){
          touchStartTarget = null;
          touchStartScrollable = null;
          return;
        }

        if(shouldIgnoreSwipeTarget(touchStartTarget)){
          touchStartTarget = null;
          touchStartScrollable = null;
          return;
        }

        if(touchStartScrollable){
          var sc = touchStartScrollable;
          var canScrollLeft = sc.scrollLeft > 2;
          var canScrollRight = sc.scrollLeft + sc.clientWidth < sc.scrollWidth - 2;
          if((dx > 0 && canScrollLeft) || (dx < 0 && canScrollRight)){
            touchStartTarget = null;
            touchStartScrollable = null;
            return;
          }
        }

        if(dx > 0) goBackBySwipe();
        else goForwardBySwipe();

        touchStartTarget = null;
        touchStartScrollable = null;
      }, {passive:true});
    }

    function safeDraw(){
      try{
        return draw();
      }catch(e){
        console.error("draw fatal", e);
        var A = document.getElementById("app");
        if(A){
          A.innerHTML = '<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:#f9fafb;font-family:Inter,system-ui,sans-serif"><div style="max-width:420px;width:100%;background:#fff;border:1px solid #eaecf0;border-radius:24px;padding:24px;box-shadow:0 12px 24px rgba(16,24,40,.08)"><div style="font-size:20px;font-weight:700;color:#101828">No se pudo abrir la app</div><div style="margin-top:8px;font-size:14px;line-height:1.6;color:#475467">Se detectó un error al renderizar la interfaz.</div><button id="retry-app" style="margin-top:16px;height:44px;padding:0 16px;border:none;border-radius:14px;background:#7f56d9;color:#fff;font:600 14px Inter,system-ui,sans-serif;cursor:pointer">Reintentar</button><div style="margin-top:12px;font-size:12px;color:#98a2b3">'+esc(e && e.message ? e.message : String(e))+'</div></div></div>';
          var r = document.getElementById("retry-app");
          if(r) r.onclick = function(){ safeDraw(); };
        }
      }
    }

    function draw(){
      var A = document.getElementById("app");
      var html = "";

      if(toastMsg){
        html += '<div style="animation:toastin .24s ease" class="fixed left-1/2 top-5 z-[100] -translate-x-1/2 rounded-full px-4 py-2 text-xs font-semibold text-white shadow-lgsoft '+(toastT === "err" ? "bg-error-700" : toastT === "warn" ? "bg-warning-700" : "bg-success-700")+'">'+esc(toastMsg)+'</div>';
      }

      if(!user){
        A.innerHTML = html + renderLogin();
        bindSwipeNavigation();

        var pin = document.getElementById("pin");
        if(pin){
          setTimeout(function(){
            try{
              pin.focus();
              pin.setSelectionRange(pin.value.length,pin.value.length);
            }catch(e){}
          },20);

          pin.oninput = function(){
            loginPin = String(pin.value || "").replace(/\D/g,"").slice(0,4);
            pin.value = loginPin;
            if(loginPin.length === 4) attemptLogin(loginPin);
          };
          pin.onkeydown = function(e){
            if(e.key === "Enter") attemptLogin(loginPin);
          };
        }
        return;
      }

      if(selItem){
        A.innerHTML = html + renderDetail();
        bindSwipeNavigation();
        bindCommon();

        document.getElementById("back-item").onclick = function(){
          selItem = null;
          adjMode = null;
          adjVal = "";
          adjNote = "";
          draw();
        };

        document.querySelectorAll("[data-adj]").forEach(function(btn){
          btn.onclick = function(){
            adjMode = btn.getAttribute("data-adj");
            draw();
            setTimeout(function(){
              var v = document.getElementById("adj-v");
              if(v) v.focus();
            },50);
          };
        });

        var adjC = document.getElementById("adj-cancel");
        if(adjC){
          adjC.onclick = function(){
            adjMode = null;
            adjVal = "";
            adjNote = "";
            draw();
          };
        }

        var adjV = document.getElementById("adj-v");
        if(adjV) adjV.oninput = function(){ adjVal = adjV.value; };

        var adjN = document.getElementById("adj-n");
        if(adjN) adjN.oninput = function(){ adjNote = adjN.value; };

        var adjO = document.getElementById("adj-ok");
        if(adjO){
          adjO.onclick = function(){
            var v = parseInt(adjVal,10);
            if(isNaN(v) || v < 0){
              toast("Valor inválido","err");
              return;
            }

            var old = selItem.stock;
            var ns;

            if(adjMode === "in") ns = old + v;
            else if(adjMode === "out") ns = Math.max(0, old - v);
            else ns = v;

            items = items.map(function(x){
              return x.id === selItem.id ? Object.assign({},x,{stock:ns}) : x;
            });

            hist.unshift({
              id:selItem.id,
              nm:selItem.name,
              cat:selItem.cat,
              tp:adjMode === "in" ? "ingreso" : adjMode === "out" ? "salida" : "ajuste",
              os:old,
              ns:ns,
              nt:adjNote,
              u:user.n,
              ts:ts()
            });

            saveAppState();
            pushUpdate(selItem, old, ns, adjMode === "in" ? "ingreso" : adjMode === "out" ? "salida" : "ajuste", adjNote);
            selItem = Object.assign({},selItem,{stock:ns});
            adjMode = null;
            adjVal = "";
            adjNote = "";
            saveSession();
            toast(selItem.name + ": " + old + " → " + ns);
            draw();
          };
        }
        return;
      }

      if(selFamily && !selStockList){
        A.innerHTML = html + renderFamily();
        bindSwipeNavigation();
        bindCommon();
        document.getElementById("back-family").onclick = function(){
          selFamily = null;
          saveSession();
          draw();
        };
        return;
      }

      if(selFamily && selStockList){
        A.innerHTML = html + renderStockListView();
        bindSwipeNavigation();
        bindCommon();
        document.getElementById("back-stocklist").onclick = function(){
          selStockList = null;
          stockListSearchQ = "";
          saveSession();
          draw();
        };

        var ssi = document.getElementById("stocklist-search-in");
        if(ssi){
          ssi.oninput = function(){
            stockListSearchQ = ssi.value;
            renderStockListResults();
          };
          setTimeout(renderStockListResults,0);
        }

        document.querySelectorAll("[data-master-cat]").forEach(function(btn){
          btn.onclick = function(){
            var cat = btn.getAttribute("data-master-cat");
            stockListSearchQ = cat;
            var input = document.getElementById("stocklist-search-in");
            if(input) input.value = cat;
            renderStockListResults();
          };
        });
        return;
      }

      if(pg === "home") A.innerHTML = html + renderHome();
      if(pg === "search") A.innerHTML = html + renderSearch();
      if(pg === "alerts") A.innerHTML = html + renderAlerts();
      if(pg === "history") A.innerHTML = html + renderHistory();
      if(pg === "report") A.innerHTML = html + renderReport();

      bindSwipeNavigation();
      bindCommon();

      var si = document.getElementById("search-in");
      if(si){
        si.oninput = function(){
          searchQ = si.value;
          renderSearchResults();
        };
        setTimeout(renderSearchResults,0);
      }

      var hfq = document.getElementById("hist-filter-q");
      if(hfq) hfq.oninput = function(){ histFilterQuery = hfq.value; renderHistoryTable(); };

      var hft = document.getElementById("hist-filter-type");
      if(hft) hft.onchange = function(){ histFilterType = hft.value; renderHistoryTable(); };

      document.querySelectorAll("[data-hsort]").forEach(function(btn){
        btn.onclick = function(){
          var k = btn.getAttribute("data-hsort");
          if(histSortKey === k){
            histSortDir = histSortDir === "asc" ? "desc" : "asc";
          }else{
            histSortKey = k;
            histSortDir = (k === "delta" ? "desc" : "asc");
          }
          renderHistoryTable();
        };
      });

      var db = document.getElementById("open-db");
      if(db) db.onclick = function(){ window.open(SHEET_URL,"_blank"); };

      if(pg === "history") setTimeout(renderHistoryTable,0);

      if(pg === "report"){
        var rff = document.getElementById("report-filter-family");
        if(rff) rff.onchange = function(){
          reportFilterFamily = rff.value;
          reportFilterStockList = "all";
          reportFilterCategory = "all";
          saveSession();
          draw();
        };

        var rfsl = document.getElementById("report-filter-stocklist");
        if(rfsl) rfsl.onchange = function(){
          reportFilterStockList = rfsl.value;
          reportFilterCategory = "all";
          saveSession();
          draw();
        };

        var rfc = document.getElementById("report-filter-category");
        if(rfc) rfc.onchange = function(){
          reportFilterCategory = rfc.value;
          saveSession();
          draw();
        };

        var rfs = document.getElementById("report-filter-status");
        if(rfs) rfs.onchange = function(){
          reportFilterStatus = rfs.value;
          saveSession();
          draw();
        };

        var rsort = document.getElementById("report-sort-key");
        if(rsort) rsort.onchange = function(){
          reportSortKey = rsort.value;
          saveSession();
          draw();
        };

        var rsq = document.getElementById("report-search-q");
        if(rsq){
          rsq.onchange = function(){
            reportSearchQ = rsq.value;
            saveSession();
            draw();
          };
          rsq.onkeydown = function(e){
            if(e.key === "Enter"){
              reportSearchQ = rsq.value;
              saveSession();
              draw();
            }
          };
        }

        var rex = document.getElementById("report-export-excel");
        if(rex) rex.onclick = function(){ reportToExcel(); };

        var rpdf = document.getElementById("report-export-pdf");
        if(rpdf) rpdf.onclick = function(){ reportToPdf(); };

        var rreset = document.getElementById("report-reset-filters");
        if(rreset) rreset.onclick = function(){
          resetReportFilters();
          saveSession();
          draw();
        };
      }

      saveSession();
    }

    function bootApp(){
      loadCachedUsers();
      loadAppState();
      loadPendingUpdates();
      loadSession();
      safeDraw();

      setTimeout(function(){
        loadUsers(true).catch(function(){});
        if(user) sync(true);
      }, 0);
    }

    window.addEventListener("online", function(){
      authError = false;
      clearSyncError();
      setSyncState("syncing");
      loadUsers(true).catch(function(){});
      if(user){
        flushPendingUpdates(true).then(function(){ sync(true); });
      }
    });

    window.addEventListener("offline", function(){
      authError = true;
      setSyncState("offline");
      setSyncError("Sin conexión");
      safeDraw();
      toast("Sin conexión: usando datos locales","warn");
    });

    if(!window.__KW_APP_BOOTED){
      window.__KW_APP_BOOTED = true;
      clearLegacyCachesOnce().finally(bootApp);
    }
  </script>
</body>
</html>
