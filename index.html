<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
@import url('https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200');

:root{
  --bg:#F8FAFC;
  --bg-soft:#F2F4F7;
  --surface:#FFFFFF;
  --surface-alt:#FCFCFD;
  --stroke:#EAECF0;
  --stroke-strong:#D0D5DD;
  --text:#101828;
  --text-soft:#475467;
  --text-muted:#667085;
  --text-faint:#98A2B3;
  --shadow-sm:0 1px 2px rgba(16,24,40,.05);
  --shadow-md:0 14px 32px rgba(16,24,40,.10);
  --shadow-lg:0 28px 64px rgba(16,24,40,.14);
  --radius-xs:10px;
  --radius-sm:12px;
  --radius-md:16px;
  --radius-lg:20px;
  --radius-xl:24px;
  --primary:#7A5AF8;
  --primary-strong:#6941C6;
  --primary-soft:#F4F3FF;
  --success:#12B76A;
  --success-soft:#ECFDF3;
  --warning:#F79009;
  --warning-soft:#FFFAEB;
  --danger:#F04438;
  --danger-soft:#FEF3F2;
  --info:#2E90FA;
  --info-soft:#EFF8FF;
  --kawas:#B6925E;
  --kawas-soft:#FFF8EB;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  min-height:100%;
  overflow:hidden;
  font-family:'Inter',system-ui,sans-serif;
  background:
    radial-gradient(circle at 0% 0%, rgba(122,90,248,.12), transparent 34%),
    radial-gradient(circle at 100% 0%, rgba(182,146,94,.14), transparent 26%),
    radial-gradient(circle at 50% 110%, rgba(46,144,250,.08), transparent 28%),
    linear-gradient(180deg,#F8FAFC 0%,#EEF2F7 100%);
  color:var(--text);
  -webkit-font-smoothing:antialiased;
  line-height:1.45;
}
input,button,select,textarea{font-family:inherit}
button{outline:none}
input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none}
input[type=number]{-moz-appearance:textfield}
::-webkit-scrollbar{width:0;height:0}
::selection{background:#E9D7FE;color:#101828}

@keyframes spin{to{transform:rotate(360deg)}}
@keyframes toast-in{from{opacity:0;transform:translate(-50%,-12px)}to{opacity:1;transform:translate(-50%,0)}}
@keyframes fade-up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@keyframes modal-in{from{opacity:0;transform:scale(.97)}to{opacity:1;transform:scale(1)}}

.mn{font-feature-settings:'tnum' 1,'lnum' 1}
.fi{animation:fade-up .32s cubic-bezier(.2,.8,.2,1) both}
.spin{width:18px;height:18px;border:2.5px solid #E4E7EC;border-top-color:var(--primary);border-radius:50%;animation:spin .8s linear infinite;display:inline-block}

.material-symbols-rounded{
  font-family:'Material Symbols Rounded';
  font-weight:normal;
  font-style:normal;
  font-size:22px;
  display:inline-block;
  line-height:1;
  text-transform:none;
  letter-spacing:normal;
  white-space:nowrap;
  direction:ltr;
  -webkit-font-smoothing:antialiased;
  font-variation-settings:'FILL' 0,'wght' 500,'GRAD' 0,'opsz' 24;
}

#app{
  position:relative;
  height:100%;
  max-width:480px;
  margin:0 auto;
  overflow:hidden;
  background:linear-gradient(180deg,rgba(255,255,255,.92),rgba(248,250,252,.98));
  backdrop-filter:blur(20px);
  box-shadow:0 32px 72px rgba(16,24,40,.14);
}
.app-shell{height:100%;display:flex;flex-direction:column;position:relative;isolation:isolate}
.app-shell:before{content:'';position:absolute;inset:-20% -40% auto auto;width:280px;height:280px;border-radius:50%;background:radial-gradient(circle,rgba(122,90,248,.11),transparent 66%);pointer-events:none;z-index:0}
.app-shell:after{content:'';position:absolute;inset:auto auto 10% -30%;width:220px;height:220px;border-radius:50%;background:radial-gradient(circle,rgba(182,146,94,.10),transparent 68%);pointer-events:none;z-index:0}
.screen-header,.app-scroll,.bottom-nav-wrap{position:relative;z-index:1}
.app-scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 16px 128px}
.screen-header{
  position:sticky;top:0;z-index:10;
  padding:24px 16px 14px;
  border-bottom:1px solid rgba(234,236,240,.82);
  background:linear-gradient(180deg,rgba(252,252,253,.98),rgba(249,250,251,.90));
  backdrop-filter:blur(18px);
}
.header-row{display:flex;align-items:center;gap:12px}
.header-copy{flex:1;min-width:0}
.eyebrow{font-size:12px;font-weight:600;color:var(--primary-strong);letter-spacing:.01em}
.page-title{font-size:22px;font-weight:700;letter-spacing:-.02em;color:var(--text)}
.page-subtitle{font-size:13px;color:var(--text-muted);margin-top:2px}
.breadcrumbs{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:10px}
.crumb{font-size:12px;color:var(--text-muted)}
.crumb.current{color:var(--text);font-weight:600}
.crumb-sep{font-size:12px;color:var(--text-faint)}

.card{
  background:linear-gradient(180deg,rgba(255,255,255,.98),rgba(252,252,253,.94));
  border:1px solid rgba(234,236,240,.92);
  border-radius:var(--radius-lg);
  box-shadow:0 1px 2px rgba(16,24,40,.04),0 12px 24px rgba(16,24,40,.04);
}
.card.pad-md{padding:18px}
.card.pad-lg{padding:22px}
.section-title{font-size:14px;font-weight:700;color:var(--text);letter-spacing:-.01em}
.section-subtitle{font-size:13px;color:var(--text-muted);margin-top:4px}

.stats-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.kpi-card{padding:18px;border-radius:18px;border:1px solid var(--stroke);background:linear-gradient(180deg,#fff,#FCFCFD);box-shadow:var(--shadow-sm)}
.kpi-label{font-size:12px;color:var(--text-muted);font-weight:600}
.kpi-value{font-size:28px;font-weight:800;letter-spacing:-.03em;margin-top:8px}
.kpi-meta{font-size:11px;color:var(--text-faint);margin-top:4px}
.kpi-card.primary .kpi-value{color:var(--primary)}
.kpi-card.warn .kpi-value{color:var(--warning)}
.kpi-card.danger .kpi-value{color:var(--danger)}
.kpi-card.success .kpi-value{color:var(--success)}

.status-badge,.soft-badge,.chip{
  display:inline-flex;align-items:center;gap:6px;
  padding:6px 10px;border-radius:999px;font-size:12px;font-weight:600;
  border:1px solid transparent;
}
.status-badge.ok{background:var(--success-soft);color:#027A48;border-color:#ABEFC6}
.status-badge.low{background:var(--warning-soft);color:#B54708;border-color:#FEDF89}
.status-badge.crit,.status-badge.zero{background:var(--danger-soft);color:#B42318;border-color:#FECDCA}
.soft-badge.primary{background:var(--primary-soft);color:var(--primary-strong);border-color:#D9D6FE}
.soft-badge.gray{background:#F2F4F7;color:var(--text-soft);border-color:#EAECF0}
.soft-badge.kawas{background:var(--kawas-soft);color:#8A6A3A;border-color:#F5E6C6}
.soft-badge.info{background:var(--info-soft);color:#175CD3;border-color:#B2DDFF}
.soft-badge.success{background:var(--success-soft);color:#027A48;border-color:#ABEFC6}
.soft-badge.warning{background:var(--warning-soft);color:#B54708;border-color:#FEDF89}
.soft-badge.danger{background:var(--danger-soft);color:#B42318;border-color:#FECDCA}

.btn, .icon-btn{
  border:none;
  cursor:pointer;
  transition:transform .15s ease, box-shadow .15s ease, background .15s ease, border-color .15s ease, color .15s ease;
}
.btn:active,.icon-btn:active{transform:translateY(1px)}
.btn{
  height:44px;padding:0 16px;border-radius:12px;font-size:14px;font-weight:600;
  display:inline-flex;align-items:center;justify-content:center;gap:8px
}
.btn-primary{background:linear-gradient(180deg,var(--primary),var(--primary-strong));color:#fff;box-shadow:0 8px 18px rgba(122,90,248,.24)}
.btn-secondary{background:#fff;color:var(--text-soft);border:1px solid var(--stroke)}
.btn-soft{background:var(--bg-soft);color:var(--text-soft)}
.btn-danger{background:linear-gradient(180deg,#F97066,#D92D20);color:#fff;box-shadow:0 8px 18px rgba(240,68,56,.20)}
.icon-btn{
  width:42px;height:42px;border-radius:12px;background:#fff;border:1px solid var(--stroke);color:var(--text-soft);
  display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow-sm)
}
.icon-btn.primary{background:var(--primary-soft);color:var(--primary-strong);border-color:#D9D6FE}
.icon-btn.warn{background:var(--warning-soft);color:#B54708;border-color:#FEDF89}

.input-wrap{
  display:flex;align-items:center;gap:10px;
  background:rgba(255,255,255,.96);
  border:1px solid var(--stroke);
  border-radius:14px;
  padding:0 14px;
  min-height:52px;
  box-shadow:var(--shadow-sm);
}
.input-wrap input{
  width:100%;min-width:0;border:none;background:transparent;outline:none;
  font-size:14px;color:var(--text);padding:14px 0;
}
.input-wrap input::placeholder{color:var(--text-faint)}
.hero-stock{
  padding:22px;
  border-radius:24px;
  background:
    radial-gradient(circle at top right, rgba(122,90,248,.16), transparent 30%),
    radial-gradient(circle at bottom left, rgba(182,146,94,.14), transparent 38%),
    linear-gradient(180deg,#FFFFFF 0%,#FCFCFD 100%);
  border:1px solid var(--stroke);
  box-shadow:0 20px 44px rgba(16,24,40,.10);
}
.hero-label{font-size:12px;font-weight:600;color:var(--text-muted)}
.hero-number{font-size:56px;line-height:1;font-weight:800;letter-spacing:-.06em;color:var(--text);margin:16px 0 8px}
.hero-unit{font-size:14px;color:var(--text-muted)}
.progress-rail{width:100%;height:10px;border-radius:999px;background:#F2F4F7;overflow:hidden}

.meta-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.mini-stat{

.mini-stat-label{font-size:11px;color:var(--text-muted);margin-top:4px}

.list-stack{display:grid;gap:12px}
.list-item{
  display:flex;align-items:center;gap:12px;
  padding:16px;border-radius:18px;border:1px solid var(--stroke);
  background:rgba(255,255,255,.96);box-shadow:var(--shadow-sm);
  cursor:pointer
}
.list-item.compact{padding:14px}
.list-item-head{flex:1;min-width:0}
.list-item-title{font-size:14px;font-weight:700;color:var(--text);line-height:1.35}
.list-item-desc{font-size:12px;color:var(--text-muted);margin-top:4px}
.list-item-value{font-size:24px;font-weight:800;letter-spacing:-.03em}
.list-icon{
  width:44px;height:44px;border-radius:14px;display:flex;align-items:center;justify-content:center;

}
.list-trailing{display:flex;align-items:flex-end;flex-direction:column;gap:8px;flex-shrink:0}
.alert-banner{
  display:flex;align-items:flex-start;gap:12px;padding:16px;border-radius:18px;
  background:linear-gradient(180deg,#FFF6ED,#FFF);
  border:1px solid #FEDF89;box-shadow:var(--shadow-sm)
}
.bottom-nav-wrap{
  position:absolute;left:16px;right:16px;bottom:16px;z-index:20
}
.bottom-nav{
  display:grid;grid-template-columns:repeat(5,1fr);gap:8px;
  padding:10px;background:rgba(255,255,255,.94);border:1px solid var(--stroke);border-radius:22px;
  box-shadow:var(--shadow-lg);backdrop-filter:blur(16px)
}
.nav-btn{
  position:relative;border:none;background:transparent;cursor:pointer;border-radius:16px;
  padding:10px 4px;display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--text-muted)
}
.nav-btn.active{background:var(--primary-soft);color:var(--primary-strong)}
.nav-btn .label{font-size:10px;font-weight:700;letter-spacing:.01em}
.nav-dot{
  position:absolute;top:8px;right:calc(50% - 18px);
  width:8px;height:8px;border-radius:50%;background:var(--danger);border:2px solid #fff
}
.login-shell{
  min-height:100%;display:flex;align-items:center;justify-content:center;padding:28px
}
.login-panel{
  width:100%;

  border:1px solid var(--stroke);
  border-radius:28px;
  box-shadow:var(--shadow-lg);
  padding:24px;
}
.brand-mark{
  width:56px;height:56px;border-radius:18px;border:1px solid rgba(255,255,255,.4);
  background:linear-gradient(180deg,#101828,#344054);
  display:flex;align-items:center;justify-content:center;box-shadow:0 10px 24px rgba(16,24,40,.16)
}
.brand-mark img{height:28px;filter:brightness(0) invert(1);opacity:.92}
.login-title{font-size:28px;font-weight:800;letter-spacing:-.04em;color:var(--text);margin-top:18px}
.login-subtitle{font-size:14px;color:var(--text-muted);margin-top:8px}
.pin-input{
  width:100%;padding:20px;border:none;background:transparent;outline:none;
  font-size:32px;font-weight:700;letter-spacing:14px;text-align:center;color:var(--text)
}
.pin-card{
  margin-top:20px;background:#fff;border:1px solid var(--stroke);border-radius:18px;box-shadow:var(--shadow-sm)
}
.user-pills{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}
.center-empty{padding:56px 18px;text-align:center;color:var(--text-faint)}
.center-empty .material-symbols-rounded{font-size:34px;display:block;margin-bottom:10px;color:#D0D5DD}

.dashboard-hero{

    radial-gradient(circle at top right, rgba(122,90,248,.22), transparent 28%),

.hero-kpi-caption{font-size:13px;color:rgba(255,255,255,.72);margin-top:8px}

.category-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}

.login-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}

}

.action-tile.in{background:linear-gradient(180deg,#F6FEF9,#fff);border-color:#ABEFC6}
.action-tile.out{background:linear-gradient(180deg,#FFFBFA,#fff);border-color:#FECDCA}

.history-meta{font-size:11px;color:var(--text-muted);margin-top:4px}
.note-line{font-size:12px;color:var(--text-soft);margin-top:4px}
.divider{height:1px;background:var(--stroke);margin:18px 0}

// â”€â”€â”€ STOCK PROJECTION â”€â”€â”€
function calcProjection(item){
  var pad=function(n){return("0"+n).slice(-2)};
  
  if(item.stock<=0) return {icon:"âŠ˜",title:"Sin stock",subtitle:"No hay unidades disponibles",days:"0",dailyUse:"-",dateOut:"-",color:"#C5221F",daysNum:0};

  // Get ALL movements for this item (any type)
  var moves=hist.filter(function(h){return h.id===item.id});
  
  // Find every time stock went DOWN (consumption), regardless of movement type
  var consumptions=[];
  moves.forEach(function(h){
    if(h.ns<h.os){
      consumptions.push({amount:h.os-h.ns, ts:h.ts, tp:h.tp});
    }
  });

  // Parse timestamps to real dates
  function parseTS(t){
    if(!t)return null;
    // Try ISO format first (from Google Sheets)
    var d=new Date(t);
    if(!isNaN(d.getTime()))return d;
    // Try DD/MM HH:MM format (local)
    var parts=t.split(" ");
    if(parts[0]&&parts[0].indexOf("/")>-1){
      var dp=parts[0].split("/");
      var day=parseInt(dp[0]),mon=parseInt(dp[1])-1;
      var yr=dp[2]?parseInt(dp[2]):new Date().getFullYear();
      if(yr<100)yr+=2000;
      var hr=0,mi=0;
      if(parts[1]&&parts[1].indexOf(":")>-1){var tp=parts[1].split(":");hr=parseInt(tp[0]);mi=parseInt(tp[1])}
      return new Date(yr,mon,day,hr,mi);
    }
    return null;
  }

  if(consumptions.length<1){
    // No consumption data - estimate from stock mÃ­nimo
    if(item.min>0){
      var estDaily=Math.max(1,Math.round(item.min/14));
      var estDays=Math.round(item.stock/estDaily);
      var estDate=new Date();estDate.setDate(estDate.getDate()+estDays);
      var dc=estDays<=7?"#C5221F":estDays<=21?"#E37400":estDays<=45?"#4A9BD9":"#137333";
      return {icon:estDays<=7?"ðŸ”´":estDays<=21?"ðŸŸ¡":estDays<=45?"ðŸ”µ":"ðŸŸ¢",title:estDays<=7?"Agotamiento inminente":estDays<=21?"Stock limitado":estDays<=45?"Stock moderado":"Stock holgado",subtitle:"Estimado (aÃºn sin datos de consumo)",days:String(estDays),dailyUse:"~"+estDaily,dateOut:pad(estDate.getDate())+"/"+pad(estDate.getMonth()+1),color:dc,daysNum:estDays};
    }
    return null;
  }

  // Total consumed
  var totalConsumed=0;
  consumptions.forEach(function(c){totalConsumed+=c.amount});

  // Calculate time span using timestamps
  var spanDays=0;
  var dates=consumptions.map(function(c){return parseTS(c.ts)}).filter(function(d){return d!==null});
  
  if(dates.length>=2){
    // Sort oldest first
    dates.sort(function(a,b){return a-b});
    var oldest=dates[0];
    var newest=dates[dates.length-1];
    spanDays=Math.max(1,Math.round(Math.abs(newest-oldest)/86400000));
  } else if(dates.length===1){
    // Single consumption: days since that date
    var now=new Date();
    spanDays=Math.max(1,Math.round(Math.abs(now-dates[0])/86400000));
  } else {
    // No parseable dates, rough estimate
    spanDays=Math.max(1,consumptions.length*3);
  }

  var dailyUse=totalConsumed/spanDays;
  if(dailyUse<=0)dailyUse=0.1;
  var daysLeft=Math.round(item.stock/dailyUse);

  var futureDate=new Date();
  futureDate.setDate(futureDate.getDate()+daysLeft);
  var dateStr=pad(futureDate.getDate())+"/"+pad(futureDate.getMonth()+1);

  var color=daysLeft<=7?"#C5221F":daysLeft<=21?"#E37400":daysLeft<=45?"#4A9BD9":"#137333";
  var icon=daysLeft<=7?"ðŸ”´":daysLeft<=21?"ðŸŸ¡":daysLeft<=45?"ðŸ”µ":"ðŸŸ¢";
  var title=daysLeft<=0?"Sin stock":daysLeft<=7?"Agotamiento inminente":daysLeft<=14?"Pedir pronto":daysLeft<=30?"Stock limitado":daysLeft<=60?"Stock moderado":"Stock holgado";

  // Build descriptive subtitle
  var types={};
  consumptions.forEach(function(c){types[c.tp]=(types[c.tp]||0)+1});
  var desc=[];
  if(types["salida"])desc.push(types["salida"]+" salida"+(types["salida"]>1?"s":""));
  if(types["ajuste"])desc.push(types["ajuste"]+" ajuste"+(types["ajuste"]>1?"s":""));
  var sub="Basado en "+(desc.length?desc.join(" + "):consumptions.length+" mov.")+" en "+spanDays+" dÃ­a"+(spanDays>1?"s":"");

  return {icon:icon,title:title,subtitle:sub,days:String(daysLeft),dailyUse:dailyUse<1?dailyUse.toFixed(1):Math.round(dailyUse).toString(),dateOut:dateStr,color:color,daysNum:daysLeft};
}
